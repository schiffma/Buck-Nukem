// One 20x32 frame, facing right. frame: idle (arms down), wave (front arm up), jump (both
// arms up in a V, body lifted 2 px), kiss (front hand at the lips, winking: blows Buck a kiss). The body is 16 px wide at an x offset of 2 so raised
// arms, rackets and towels fit inside the canvas.
function buildFanFrame(v, frame) {
  const c = makeCanvas(FAN_W, FAN_H), g = c.getContext("2d");
  const skin = FAN_SKIN[v.skin], hair = FAN_HAIR[v.hairCol], acc = FAN_ACCENT[v.accent];
  const ox = 2, oy = frame === "jump" ? 2 : 4;
  const P = function (col, x, y, w, h) { g.fillStyle = col; g.fillRect(ox + x, oy + y, w || 1, h || 1); };
  const WHITE = "#f4f4f0", SHADE = "#d4d4d0", cheer = frame === "wave" || frame === "jump", kiss = frame === "kiss";
  // legs (tucked a little when jumping), socks with a stripe, sneakers
  const lg = frame === "jump" ? 1 : 0;
  P(skin, 5, 19, 2, 5 - lg); P(skin, 9, 19, 2, 5 - lg);
  P(WHITE, 5, 23 - lg, 2, 2); P(WHITE, 9, 23 - lg, 2, 2); P(acc, 5, 23 - lg, 2, 1); P(acc, 9, 23 - lg, 2, 1);
  P(WHITE, 4, 25 - lg, 3, 2); P(WHITE, 9, 25 - lg, 3, 2); P("#9aa0a8", 4, 26 - lg, 3, 1); P("#9aa0a8", 9, 26 - lg, 3, 1);
  // tennis dress: top with a coloured collar, pleated skirt with a waist stripe
  P(WHITE, 4, 10, 8, 5); P(acc, 6, 10, 4, 1); P(SHADE, 4, 14, 8, 1);
  P(WHITE, 3, 15, 10, 4); P(acc, 3, 15, 10, 1); P(SHADE, 3, 18, 10, 1);
  for (let x = 4; x < 13; x += 2) P(SHADE, x, 16, 1, 2);
  // neck and face (three-quarter view facing right): eye, mouth (open when cheering)
  P(skin, 7, 9, 2, 1);
  P(skin, 5, 3, 6, 6); P(skin, 11, 5, 1, 2);
  if (kiss) { P("#101018", 8, 5, 2, 1); P("#d02040", 10, 7); P("#d02040", 10, 8); }   // wink, puckered lips
  else {
    P("#101018", 9, 5);
    if (cheer) { P("#801818", 9, 7, 2, 1); P("#f0f0f0", 9, 7); } else P("#a04030", 9, 7, 2, 1);
  }
  // hair
  switch (v.hair) {
    case "ponytail": P(hair, 5, 2, 6, 2); P(hair, 4, 3, 2, 4); P(hair, 2, 4, 2, 2); P(hair, 1, 6, 2, 3); P(acc, 4, 3); break;
    case "bob": P(hair, 4, 2, 7, 2); P(hair, 3, 3, 3, 5); P(hair, 10, 3, 1, 1); break;
    case "afro": P(hair, 4, 0, 7, 1); P(hair, 2, 1, 10, 3); P(hair, 2, 4, 4, 4); P(hair, 10, 2, 2, 2); break;
    case "bun": P(hair, 5, 2, 6, 2); P(hair, 4, 3, 2, 3); P(hair, 4, 0, 3, 2); break;
    case "long": P(hair, 5, 2, 6, 2); P(hair, 3, 3, 3, 8); P(hair, 10, 3, 1, 1); break;
    case "pigtails": P(hair, 5, 2, 6, 2); P(hair, 4, 3, 2, 3); P(hair, 2, 4, 2, 4); P(hair, 12, 3, 1, 4); P(acc, 3, 4); P(acc, 12, 3); break;
    case "curly": P(hair, 4, 1, 7, 2); P(hair, 3, 2, 3, 6); P(hair, 2, 4, 1, 3); P(hair, 10, 2, 2, 1); P(hair, 4, 8, 1, 2); break;
  }
  if (v.item === "headband") P(acc, 5, 3, 6, 1);
  if (v.item === "visor") { P(acc, 5, 3, 6, 1); P(acc, 11, 3, 2, 1); }
  if (v.item === "cap") { P(acc, 4, 1, 7, 2); P(acc, 11, 2, 3, 1); }
  if (v.item === "sunglasses" && !kiss) P("#101018", 8, 5, 3, 1);
  // arms (2 px wide) with wristbands: down at the sides, or raised up and out in a V
  function armDown(x) { P(skin, x, 10, 1, 6); P(acc, x, 14); return { x: x, y: 16 }; }
  function armUp(dir) {            // dir 1 = front (right), -1 = back (left)
    const pts = dir > 0 ? [[12, 10], [13, 9], [13, 8], [14, 7], [14, 6], [15, 5]] : [[3, 10], [2, 9], [2, 8], [1, 7], [1, 6], [0, 5]];
    pts.forEach(function (q) { P(skin, q[0], q[1], 1, 1); P(skin, q[0] - dir, q[1], 1, 1); });
    P(acc, pts[3][0], pts[3][1]); P(acc, pts[3][0] - dir, pts[3][1]);
    return { x: pts[5][0], y: pts[5][1] - 1 };
  }
  function armToLips() {           // front arm bent up, hand at the mouth
    [[12, 10], [12, 9], [12, 8], [11, 7]].forEach(function (q) { P(skin, q[0], q[1], 1, 1); });
    P(acc, 12, 9);
    return { x: 11, y: 6 };
  }
  const hand = frame === "idle" ? armDown(12) : kiss ? armToLips() : armUp(1);
  const backHand = frame === "jump" ? armUp(-1) : armDown(3);
  P(skin, hand.x, hand.y); P(skin, backHand.x, backHand.y);
  const up = cheer;
  if (v.item === "racket" && !kiss) {              // wooden grip, black frame, light strings
    if (up) { P("#5a3a1a", hand.x, hand.y - 2, 1, 2); P("#202020", hand.x - 1, hand.y - 7, 3, 5); P("#e8e8d8", hand.x, hand.y - 6, 1, 3); }
    else { P("#5a3a1a", hand.x, hand.y + 1, 1, 2); P("#202020", hand.x - 1, hand.y + 3, 3, 5); P("#e8e8d8", hand.x, hand.y + 4, 1, 3); }
  } else if (v.item === "towel" && !kiss) {        // white towel with a coloured stripe, swung overhead
    if (up) { P(WHITE, hand.x - 1, hand.y - 4, 3, 4); P(acc, hand.x - 1, hand.y - 2, 3, 1); }
    else { P(WHITE, hand.x, hand.y + 1, 2, 5); P(acc, hand.x, hand.y + 3, 2, 1); }
  }
  return c;
}

// SPR.fans[variant][frame] = sprite set (outlined, mirrored, flash)
function buildFanSprites() {
  SPR.fans = FAN_VARIANTS.map(function (v) {
    const set = {};
    FAN_FRAMES.forEach(function (f) { set[f] = makeSet(buildFanFrame(v, f)); });
    return set;
  });
}

// ---- behaviour: idle cheer, face Buck, react to his successes ----
// Comic speech bubble (fans and lawyers): cream box with a dark outline at (x, y), w x h, red
// text, and a tail pointing down at screen x tx.
function drawSpeechBubble(text, x, y, w, h, tx) {
  fillRect(x - 1, y - 1, w + 2, h + 2, "#101018");                 // outline
  fillRect(x, y, w, h, "#fffbe8");
  tx = clamp(tx, x + 3, x + w - 4);
  fillRect(tx - 1, y + h, 3, 1, "#fffbe8"); fillRect(tx, y + h + 1, 1, 1, "#fffbe8");   // tail
  fillRect(tx - 2, y + h, 1, 1, "#101018"); fillRect(tx + 2, y + h, 1, 1, "#101018"); fillRect(tx - 1, y + h + 1, 1, 1, "#101018"); fillRect(tx + 1, y + h + 1, 1, 1, "#101018"); fillRect(tx, y + h + 2, 1, 1, "#101018");
  drawText(text, x + 3, y + 2, "#c01818");
}

const Fans = {
  list: [], lastCheer: -99, lastWhistle: -99, time: 0, hearts: [], decks: {}, shown: [],
  spawn(level, levelIndex) {
    this.list = []; this.lastCheer = -99; this.lastWhistle = -99; this.time = 0; this.hearts = []; this.decks = {}; this.shown = [];
    const self = this;
    level.spawns.filter(function (s) { return s.ch === "F"; }).forEach(function (s, i) {
      self.list.push({ tx: s.tx, ty: s.ty, x: s.tx * TILE + TILE / 2 - FAN_W / 2, y: (s.ty + 1) * TILE - (FAN_H - 1),
        variant: (levelIndex * 5 + i) % FAN_VARIANTS.length, face: -1, phase: i * 0.37, cheerT: 0, bubble: null, shoutT: 0, kissT: 0 });
    });
    return this.list;
  },
  update(dt) {
    this.time += dt;
    const pcx = Player.cx();
    for (const f of this.list) {
      const d = pcx - (f.x + FAN_W / 2);
      if (Math.abs(d) > 6) f.face = d > 0 ? 1 : -1;     // dead zone: no flicker when Buck is right above her
      if (f.cheerT > 0) f.cheerT = Math.max(0, f.cheerT - dt);
      if (f.bubble && (f.bubble.t -= dt) <= 0) f.bubble = null;
      if (f.shoutT > 0) f.shoutT -= dt;
      if (f.kissT > 0) f.kissT = Math.max(0, f.kissT - dt);
    }
    // shout-outs: Buck walks past (within 4 tiles, about the same height) -> she blows him a
    // kiss, a heart floats up and she calls out; once per 8 s per fan; wolf whistle once per 4 s
    const live = !Player.dead && (Game.state === STATE.PLAY || Game.state === STATE.BOSS);
    if (live) {
      const pcy = Player.y + Player.h;
      let talking = this.list.filter(function (f) { return f.bubble; }).length;
      for (const f of this.list) {
        if (f.shoutT > 0 || f.bubble || talking >= FAN_MAX_BUBBLES) continue;
        if (Math.abs(pcx - (f.x + FAN_W / 2)) > FAN_SHOUT_RANGE || Math.abs(pcy - (f.y + FAN_H)) > 2 * TILE) continue;
        this.shout(f); talking++;
      }
    }
    for (let i = this.hearts.length - 1; i >= 0; i--) {
      const h = this.hearts[i];
      h.t -= dt; h.y -= 22 * dt; h.x += Math.sin((0.8 - h.t) * 9) * 8 * dt;     // drift up, sway
      if (h.t <= 0) this.hearts.splice(i, 1);
    }
  },
  // a small heart floats up from a fan (blowing Buck a kiss): rises and fades over 0.8 s
  addHeart(f) {
    this.hearts.push({ x: f.x + FAN_W / 2 + (f.face > 0 ? 3 : -3), y: f.y + 4, t: 0.8 });
  },
  drawHearts(camX, camY) {
    for (const h of this.hearts) {
      ctx.globalAlpha = Math.min(1, h.t / 0.4);
      drawText("♥", Math.round(h.x - camX - 2), Math.round(h.y - camY + HUD_H), "#ff3070");
    }
    ctx.globalAlpha = 1;
  },
  frame(f) {
    if (f.kissT > 0) return "kiss";
    if (f.cheerT > 0) return Math.floor(f.cheerT / 0.15) % 2 ? "jump" : "wave";
    return ((this.time + f.phase) % 0.9) < 0.35 ? "wave" : "idle";   // idle cheer loop
  },
  // Next line for an occasion: a shuffled deck per occasion, never a line already on screen.
  pickLine(kind) {
    const pool = FAN_LINES[kind] || FAN_LINES.kill;
    const onScreen = this.list.filter(function (f) { return f.bubble; }).map(function (f) { return f.bubble.text; });
    for (let tries = 0; tries < pool.length + 1; tries++) {
      let deck = this.decks[kind];
      if (!deck || !deck.length) {
        deck = this.decks[kind] = pool.slice();
        for (let i = deck.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); const t = deck[i]; deck[i] = deck[k]; deck[k] = t; }
      }
      const line = deck.pop();
      if (onScreen.indexOf(line) < 0) return line;
    }
    return pool[0];
  },
  say(f, kind) { f.bubble = { text: this.pickLine(kind), t: FAN_BUBBLE_T, kind: kind }; },
  shout(f) {
    this.say(f, "shout");
    f.shoutT = FAN_SHOUT_COOLDOWN; f.kissT = FAN_KISS_T;
    this.addHeart(f);
    if (this.time - this.lastWhistle >= FAN_WHISTLE_GAP) { this.lastWhistle = this.time; Sound.play("whistle"); }
  },
  // Buck scored near (x, y): every fan within 12 tiles cheers; the nearest ones (up to the
  // bubble limit) each say their own line for the occasion; the cheer sound plays at most
  // once per 1.5 s.
  react(x, y, kind) {
    const near = [];
    for (const f of this.list) {
      const d = Math.hypot(f.x + FAN_W / 2 - x, f.y + FAN_H / 2 - y);
      if (d > 12 * TILE) continue;
      f.cheerT = 1.0;
      near.push({ f: f, d: d });
    }
    if (!near.length) return false;
    near.sort(function (a, b) { return a.d - b.d; });
    let talking = this.list.filter(function (f) { return f.bubble; }).length;
    for (const n of near) {
      if (talking >= FAN_MAX_BUBBLES) break;
      if (n.f.bubble) continue;
      this.say(n.f, kind); talking++;
    }
    if (this.time - this.lastCheer >= 1.5) { this.lastCheer = this.time; Sound.play("cheer"); }
    return true;
  },
  // Lays out the speech bubbles: at most 3, fans nearest to Buck first. A bubble that would
  // overlap one already placed slides beside it, else moves up a row (at most twice); if it
  // still doesn't fit it waits (its timer runs on).
  layoutBubbles(camX, camY) {
    const pcx = Player.cx(), pcy = Player.cy();
    const talk = this.list.filter(function (f) { return f.bubble; }).sort(function (a, b) {
      return Math.hypot(a.x - pcx, a.y - pcy) - Math.hypot(b.x - pcx, b.y - pcy);
    });
    const out = [];
    for (const f of talk) {
      if (out.length >= FAN_MAX_BUBBLES) break;
      const w = textWidth(f.bubble.text) + 6, h = 11;
      const fx = Math.round(f.x + FAN_W / 2 - camX);
      const y0 = Math.round(f.y - camY + HUD_H) - h - 2;
      const free = function (x, y) {
        return x >= 2 && x + w <= W - 2 && out.every(function (r) { return x + w + 2 <= r.x || r.x + r.w + 2 <= x || y + h + 3 <= r.y || r.y + r.h + 3 <= y; });
      };
      let spot = null;
      for (let k = 0; k < 3 && !spot; k++) {
        const y = Math.max(HUD_H + 2, y0 - k * (h + 2));
        // centred over her, else right beside a placed bubble (the side nearer to her)
        const xs = [clamp(Math.round(fx - w / 2), 2, W - w - 2)];
        out.forEach(function (r) { xs.push(r.x + r.w + 3, r.x - w - 3); });
        xs.sort(function (a, b) { return Math.abs(a + w / 2 - fx) - Math.abs(b + w / 2 - fx); });
        for (const x of xs) if (free(x, y) && Math.abs(x + w / 2 - fx) < w / 2 + 40) { spot = { x: x, y: y }; break; }
      }
      if (spot) out.push({ fan: f, text: f.bubble.text, x: spot.x, y: spot.y, w: w, h: h, tx: fx });
    }
    this.shown = out;
    return out;
  },
  drawBubble(camX, camY) {
    for (const b of this.layoutBubbles(camX, camY)) drawSpeechBubble(b.text, b.x, b.y, b.w, b.h, b.tx);
  },
  draw(camX, camY) {
    for (const f of this.list) {
      const set = SPR.fans[f.variant][this.frame(f)];
      const hop = f.cheerT > 0 ? Math.round(Math.abs(Math.sin(f.cheerT * Math.PI * 3)) * 3) : 0;
      const px = Math.round(f.x - camX) - set.pad, py = Math.round(f.y - camY + HUD_H - hop) - set.pad;
      if (px < -FAN_W - 4 || px > W + 4) continue;
      ctx.drawImage(f.face > 0 ? set.r : set.l, px, py);
    }
  },
};


// ---- bar.js ----
// Clubhouse bar scene (decoration only, like the fans): regulars on stools at the counter (map
// character O) lift their beers and now and then clink glasses with a "PROST!" bubble; the
// blonde waitress (W) works behind the counter - the counter tiles hide her from the waist
// down - walking between the taps and pulling beers. W sits in the cell above the counter (so
// the counter tile stays whole); she stands on the counter row's floor. Nothing collides.
const BAR_GUY_H = 24, WAITRESS_H = 30;
const BAR_PROST_GAP = 6, BAR_PROST_T = 1.5, BAR_CLINK_T = 0.6, BAR_DRINK_T = 0.8;
const BAR_WAITRESS_SPEED = 14, BAR_POUR_T = 2;
const BAR_STEP = 8;            // she stands on a raised step behind the bar: visible from the chest up

const Bar = {
  guys: [], waitress: null, bubble: null, prostCd: 0, prostCheck: 0, time: 0,

  spawn(level) {
    this.guys = []; this.waitress = null; this.bubble = null; this.prostCd = 3; this.prostCheck = 0; this.time = 0;
    const self = this;
    const ws = level.spawns.filter(function (s) { return s.ch === "W"; })[0];
    let cx0 = null, cx1 = null;
    if (ws) {                                   // the counter's columns below the waitress's cell
      const row = ws.ty + 1;
      const isCounter = function (tx) { const c = level.at(tx, row); return c === "a" || c === "A"; };
      cx0 = ws.tx; cx1 = ws.tx;
      while (isCounter(cx0 - 1)) cx0--;
      while (isCounter(cx1 + 1)) cx1++;
      this.waitress = { x: ws.tx * TILE, y: (row + 1) * TILE - WAITRESS_H - BAR_STEP, minX: cx0 * TILE, maxX: cx1 * TILE, face: 1,
        pourT: 0, nextPour: rnd(4, 8), counterTop: row * TILE };
    }
    const mid = cx0 !== null ? (cx0 + cx1 + 1) * TILE / 2 : null;
    level.spawns.filter(function (s) { return s.ch === "O"; }).forEach(function (s, i) {
      const x = s.tx * TILE;
      self.guys.push({ x: x, y: (s.ty + 1) * TILE - BAR_GUY_H, look: i % SPR.barGuys.length,
        face: mid === null || mid > x + TILE / 2 ? 1 : -1, t: rnd(1, 4), drinkT: 0, clinkT: 0 });
    });
    return this;
  },

  frame(g) { return g.clinkT > 0 ? "clink" : g.drinkT > 0 ? "drink" : "idle"; },

  update(dt) {
    this.time += dt;
    for (const g of this.guys) {
      if (g.clinkT > 0) g.clinkT -= dt;
      if (g.drinkT > 0) g.drinkT -= dt;
      else if ((g.t -= dt) <= 0) { g.drinkT = BAR_DRINK_T; g.t = rnd(3, 6); }
    }
    // PROST: two neighbouring regulars clink glasses, at most once per BAR_PROST_GAP s
    if (this.bubble && (this.bubble.t -= dt) <= 0) this.bubble = null;
    if (this.prostCd > 0) this.prostCd -= dt;
    else if (this.guys.length >= 2 && (this.prostCheck -= dt) <= 0) {
      this.prostCheck = 0.5;
      if (Math.random() < 0.25) {
        const i = Math.floor(Math.random() * (this.guys.length - 1));
        this.guys[i].clinkT = BAR_CLINK_T; this.guys[i + 1].clinkT = BAR_CLINK_T;
        this.bubble = { text: "PROST!", t: BAR_PROST_T, guy: i };
        this.prostCd = BAR_PROST_GAP;
      }
    }
    const w = this.waitress;
    if (w) {
      if (w.pourT > 0) w.pourT -= dt;
      else {
        w.x += w.face * BAR_WAITRESS_SPEED * dt;
        if (w.x <= w.minX) { w.x = w.minX; w.face = 1; }
        if (w.x >= w.maxX) { w.x = w.maxX; w.face = -1; }
        if ((w.nextPour -= dt) <= 0) { w.pourT = BAR_POUR_T; w.nextPour = rnd(4, 8); }
      }
    }
  },

  // the waitress, before the main tiles: the counter in front hides her below the waist
  drawBack(camX, camY) {
    const w = this.waitress;
    if (!w) return;
    const set = w.pourT > 0 ? SPR.waitress.pour : SPR.waitress.walk[Math.floor(this.time * 6) % 2];
    const px = Math.round(w.x - camX), py = Math.round(w.y - camY + HUD_H);
    if (px < -TILE * 2 || px > W + TILE) return;
    ctx.drawImage(w.face > 0 ? set.r : set.l, px - set.pad, py - set.pad);
  },

  // the regulars and the glass she is filling, in front of the counter
  drawFront(camX, camY) {
    for (const g of this.guys) {
      const set = SPR.barGuys[g.look][this.frame(g)];
      const px = Math.round(g.x - camX), py = Math.round(g.y - camY + HUD_H);
      if (px < -TILE * 2 || px > W + TILE) continue;
      ctx.drawImage(g.face > 0 ? set.r : set.l, px - set.pad, py - set.pad);
    }
    const w = this.waitress;
    if (w && w.pourT > 0) {
      const f = Math.min(2, Math.floor((BAR_POUR_T - w.pourT) / (BAR_POUR_T / 3)));
      const set = SPR.beerGlass[f];
      const gx = Math.round(w.x + (w.face > 0 ? 12 : 0) - camX), gy = Math.round(w.counterTop - 6 - camY + HUD_H);
      ctx.drawImage(set.r, gx - set.pad, gy - set.pad);
    }
  },

  drawBubble(camX, camY) {
    const b = this.bubble;
    if (!b || !this.guys[b.guy]) return;
    const g = this.guys[b.guy], w = textWidth(b.text) + 6, h = 11;
    const cx = Math.round(g.x + TILE / 2 - camX), top = Math.round(g.y - camY + HUD_H) - h - 3;
    if (cx < -40 || cx > W + 40) return;
    drawSpeechBubble(b.text, clamp(cx - Math.floor(w / 2), 2, W - w - 2), Math.max(HUD_H + 2, top), w, h, cx);
  },
};

// 16px status bar: score, segmented health, lives, weapon, key cards; boss bar in the arena.
function drawHud() {
  fillRect(0, 0, W, HUD_H, "#14141c");

  drawText("HP", 52, 5, "#ff8080");
  for (let i = 0; i < CONFIG.maxHp; i++) {
    const on = i < Player.hp;
    fillRect(66 + i * 6, 4, 5, 9, on ? (Player.hp <= 2 ? "#ff3030" : "#30d040") : "#3a2228");
    if (on) fillRect(66 + i * 6, 4, 5, 2, "rgba(255,255,255,0.35)");
  }
  // lives: hero head icon
  drawHead(ctx, 120, 0);
  drawText("X" + Math.max(0, Player.lives), 137, 5, "#ffffff");
  // weapon
  const mega = Player.weapon === "mega", cutter = Player.weapon === "cutter", megaCut = Player.weapon === "megacutter";
  ctx.drawImage(megaCut ? SPR.megaCutterIcon : cutter ? SPR.cutterIcon : mega ? SPR.megaIcon : SPR.blasterIcon, 158, 5);
  drawText(megaCut ? "MEGA CUTTER" : cutter ? "DISC CUTTER" : mega ? "MEGA" : "BLASTER", 171, 5,
    megaCut ? "#ffb040" : cutter ? "#ff9a30" : mega ? "#60c0ff" : "#c0c4cc");
  // keys
  let kx = cutter || megaCut ? 240 : 222;            // "DISC CUTTER" / "MEGA CUTTER" are longer labels
  ["R", "U", "G"].forEach(function (k) {
    if (Player.keys[k]) ctx.drawImage(SPR.keysHud[k], kx, 4);
    else { ctx.strokeStyle = "#33333d"; ctx.strokeRect(kx + 0.5, 4.5, 9, 7); }
    kx += 12;
  });
  // level number
  drawText("L" + (Game.levelIndex + 1), W - 4, 5, "#8890a0", { align: "right" });

  if (Game.boss && Game.boss.active) {
    const b = Game.boss;
    const w = 160, x = (W - w) / 2, y = HUD_H + 4;
    fillRect(x - 1, y - 1, w + 2, 8, "#000");
    fillRect(x, y, w, 6, "#401010");
    fillRect(x, y, Math.round(w * Math.max(0, b.hp) / b.maxHp), 6, b.enraged() ? "#ff4020" : "#e08020");
    drawText("GIANT MUTANT CRAYFISH", W / 2, y + 9, "#ffd0a0", { align: "center", shadow: "#000" });
  }
}

};
function promptText(kind) { return PROMPTS[kind][Touch.on ? 1 : 0]; }
const TAGLINE = ["HE CAME FOR THE TENNIS.", "HE STAYED FOR THE CARNAGE."];

// Records every string drawn while active (used by the tests to check screen content).

function drawFramedPortrait(x, y) {

  ctx.drawImage(IMG.portrait, x, y);
}

function blink(rate) { return Math.floor(Game.time * (rate || 2)) % 2 === 0; }

// Big distressed, outlined poster lettering; cached per text/scale/colour.
const logoCache = {};
function posterLogo(text, scale, top, bottom) {
  const key = text + scale + top + bottom;
  if (logoCache[key]) return logoCache[key];
  const tw = textWidth(text, scale), th = 7 * scale;
  const c = makeCanvas(tw + 6, th + 6);
  const g = c.getContext("2d");
  // glyphs into a temp canvas, then outline by stamping black at 8 offsets
  const glyph = makeCanvas(tw, th), gg = glyph.getContext("2d");
  const atlas = fontAtlas("#ffffff");
  for (let i = 0; i < text.length; i++) {
    const idx = FONT_CHARS.indexOf(text[i]);
    if (idx >= 0) gg.drawImage(atlas, idx * 6, 0, 5, 7, i * 6 * scale, 0, 5 * scale, 7 * scale);
  }
  const black = makeCanvas(tw, th), bg = black.getContext("2d");
  bg.drawImage(glyph, 0, 0); bg.globalCompositeOperation = "source-in"; bg.fillStyle = "#0a0608"; bg.fillRect(0, 0, tw, th);
  for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) if (dx || dy) g.drawImage(black, 3 + dx, 3 + dy);
  g.drawImage(black, 5, 6);                                  // drop shadow
  // two-tone fill: top colour above the middle, bottom colour below
  const fill = makeCanvas(tw, th), fg = fill.getContext("2d");
  fg.fillStyle = bottom; fg.fillRect(0, 0, tw, th);
  fg.fillStyle = top; fg.fillRect(0, 0, tw, Math.floor(th * 0.5));
  fg.fillStyle = "rgba(255,255,255,0.35)"; fg.fillRect(0, 0, tw, scale);
  fg.globalCompositeOperation = "destination-in"; fg.drawImage(glyph, 0, 0);
  g.drawImage(fill, 3, 3);
  // distress: punch small holes and scrapes
  const rng = makeRng(text.length * 131 + scale);
  g.globalCompositeOperation = "destination-out";
  for (let i = 0; i < tw * th * 0.012; i++) {
    const x = 3 + rng() * tw, y = 3 + rng() * th, s = 1 + (rng() < 0.3 ? 1 : 0);
    g.fillRect(Math.floor(x), Math.floor(y), s, s);
  }
  for (let i = 0; i < 3; i++) g.fillRect(Math.floor(rng() * tw), Math.floor(3 + rng() * th), Math.floor(4 + rng() * 10), 1);
  c.text = text;
  logoCache[key] = c;
  return c;
}
function drawLogo(text, cx, y, scale, top, bottom) {
  const c = posterLogo(text, scale, top || "#ffd840", bottom || "#e8401a");
  if (TEXT_LOG.active) TEXT_LOG.items.push(text);
  ctx.drawImage(c, Math.round(cx - c.width / 2), y);
}

// Halftone dots + torn paper border for the poster look (pre-rendered).
let posterOverlay = null;
function getPosterOverlay() {
  if (posterOverlay) return posterOverlay;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = "rgba(10,4,2,0.35)";
  for (let y = 0; y < H; y += 3) for (let x = (y / 3) % 2 ? 1 : 0; x < W; x += 3) g.fillRect(x, y, 1, 1);
  const rng = makeRng(7);
  g.fillStyle = "#d8c8a0";
  for (let x = 0; x < W; x += 2) {
    g.fillRect(x, 0, 2, 3 + Math.floor(rng() * 4));
    const b = 3 + Math.floor(rng() * 4); g.fillRect(x, H - b, 2, b);
  }
  for (let y = 0; y < H; y += 2) {
    g.fillRect(0, y, 3 + Math.floor(rng() * 4), 2);
    const r = 3 + Math.floor(rng() * 4); g.fillRect(W - r, y, r, 2);
  }
  g.fillStyle = "rgba(120,90,40,0.5)";                       // stains on the paper
  for (let i = 0; i < 30; i++) g.fillRect(Math.floor(rng() * W), rng() < 0.5 ? Math.floor(rng() * 6) : H - 6 + Math.floor(rng() * 6), 2, 2);
  posterOverlay = c;
  return c;
}

function drawBadge(x, y) {

// Phases of the film-reel level intro. Durations in seconds.
const INTRO = { missing: 1.6, leaderStep: 0.4, leaderSteps: 3, card: 1.4 };
function introPhases(isBoss) {
  const ph = [];
  if (isBoss) ph.push({ name: "missing", d: INTRO.missing });
  for (let i = 0; i < INTRO.leaderSteps; i++) ph.push({ name: "leader", d: INTRO.leaderStep, n: INTRO.leaderSteps - i });
  ph.push({ name: "card", d: INTRO.card });
  return ph;
}
function introTotal(isBoss) { return introPhases(isBoss).reduce(function (a, p) { return a + p.d; }, 0); }
function introPhaseAt(isBoss, t) {
  let acc = 0;
  for (const p of introPhases(isBoss)) { if (t < acc + p.d) return { name: p.name, n: p.n, t: (t - acc) / p.d }; acc += p.d; }
  return { name: "done" };
}

}

// ---- main.js ----
// Game state machine, fixed-timestep loop, pickups, checkpoints and level flow.
const PICKUP_INFO = {
  o: { img: function () { return SPR.ball; } },
  t: { img: function () { return SPR.trophy; } },
  h: { img: function () { return SPR.rivella; } },
  s: { img: function () { return SPR.cervelat; } },
  "+": { img: function () { return SPR.life; } },
  w: { img: function () { return Game.level && Game.level.isBoss ? SPR.megaCutter : SPR.megagun; } },   // arena: Mega Cutter
  r: { img: function () { return SPR.keys.R; } },
  u: { img: function () { return SPR.keys.U; } },
  g: { img: function () { return SPR.keys.G; } },
};
const KEY_NAMES = { R: "RED", U: "BLUE", G: "GREEN" };

const Game = {
  state: STATE.TITLE, prevState: null, stateT: 0, time: 0,
  score: 0, levelIndex: 0, level: null,
  enemies: [], shots: [], enemyShots: [], pickups: [], checkpoints: [], exit: null, boss: null,
  stats: { shots: 0, kills: 0 }, tally: null, levelTime: 0, godMode: false, showDebug: false,
  ups: 0, fps: 0, lockedMsgT: 0, arenaHealthSpots: [], hurtFlash: 0,

  setState(s) {
    this.prevState = this.state; this.state = s; this.stateT = 0;
    if (s === STATE.TITLE) { Sound.setTrack("title"); Sound.setTempo(1); } else Sound.setTrack("valkyries");
  },

  startHash: null,           // tests: stands in for location.hash when set
  reveal: null,              // boss reveal pan at arena start: { t, x0, xb, back }

  newGame() {
    this.score = 0;
    Player.resetForGame();
    // a link like buck_nukem.html#level=4 starts every new game at that reel
    this.loadLevel(startLevelFromHash(this.startHash !== null ? this.startHash : location.hash));
  },

  loadLevel(i, data) {       // data: optional map override (used by the test harness)
    this.levelIndex = i;
    const L = this.level = new Level(data || LEVEL_DATA[i], i);
    Camera.anchorX = L.isBoss ? CONFIG.bossCamX : W / 2;   // boss arena: Buck on the left, the boss ahead
    this.fans = Fans.spawn(L, i);
    Bar.spawn(L);
    this.enemies = []; this.shots = []; this.enemyShots = []; this.pickups = []; this.checkpoints = [];
    this.reveal = null;
    this.exit = null; this.boss = null; Boss.active = false; this.arenaHealthSpots = []; this.arenaUpgradeSpot = null; this.upgradeT = 0;
    this.stats = { shots: 0, kills: 0 }; this.levelTime = 0; this.hurtFlash = 0;
    FX.clear();
    Player.keys = {};
    let start = null;
    const self = this;
    L.spawns.forEach(function (s) {
      const bx = s.tx * TILE + TILE / 2, by = (s.ty + 1) * TILE;
      switch (s.ch) {
        case "P": start = { x: bx - Player.w / 2, y: by - STAND_H }; break;
        case "L": self.enemies.push(makeEnemy("lawyer", bx, by, L, -1)); break;
        case "K": self.enemies.push(makeEnemy("cray", bx, by, L, -1)); break;
        case "M": self.enemies.push(makeEnemy("punk", bx, by, L, -1)); break;
        case "X": Boss.init(s.tx * TILE, by); break;
        case "C": self.checkpoints.push({ x: bx - 4, y: by - 24, w: 8, h: 24, on: false }); break;
        case "E": self.exit = { x: s.tx * TILE, y: by - 32, w: 16, h: 32 }; break;
        case "F": break;                                   // cheering fans: see Fans.spawn
        case "O": case "W": break;                         // bar regulars and waitress: see Bar.spawn
        case "h": if (L.isBoss) self.arenaHealthSpots.push({ x: bx, y: by }); self.addPickup(s.ch, bx, by); break;
        case "w": if (L.isBoss) self.arenaUpgradeSpot = { x: bx, y: by }; self.addPickup(s.ch, bx, by); break;
        default: self.addPickup(s.ch, bx, by);
      }
    });
    if (!start) start = { x: 32, y: 32 };
    Player.placeAt(start.x, start.y);
    Player.setCheckpoint(start.x, start.y);
    Player.hp = CONFIG.maxHp;
    Player.invuln = 0;
    Camera.snap(Player, L);
    Sound.setTempo(L.isBoss ? 1.25 : 1);
    if (L.isBoss) Player.weapon = "cutter";             // the finale is fought with the disc cutter
    this.setState(STATE.LEVEL_INTRO);
  },

  addPickup(ch, bx, by) {
    const img = PICKUP_INFO[ch].img();
    this.pickups.push({ type: ch, img: img, x: bx - img.width / 2, y: by - img.height - 2, w: img.width, h: img.height, t: Math.random() * 6 });
  },

  addScore(n) { this.score += n; },

  collectPickup(p) {
    const P = Player, cx = p.x + p.w / 2;
    switch (p.type) {
      case "o": this.addScore(CONFIG.ballPoints); FX.text(cx, p.y, CONFIG.ballPoints, "#d8f040"); Sound.play("pickup"); break;
      case "t": this.addScore(CONFIG.trophyPoints); FX.text(cx, p.y, CONFIG.trophyPoints, "#ffd840"); Sound.play("pickup"); Fans.react(cx, p.y, "trophy"); break;
      case "h": P.heal(2); FX.text(cx, p.y, "RIVELLA +2", "#80ff80"); Sound.play("health"); break;
      case "s": P.heal(3); FX.text(cx, p.y, "CERVELAT +3", "#80ff80"); Sound.play("health"); break;
      case "+": P.lives++; FX.text(cx, p.y, "1UP", "#ffffff"); Sound.play("oneup"); break;
      case "w":
        if (this.level.isBoss) {            // boss arena: the disc cutter upgrade; comes back later
          P.weapon = "megacutter"; FX.text(cx, p.y, "MEGA CUTTER!", "#ffb040"); this.upgradeT = CONFIG.upgradeRespawn;
        } else { P.weapon = "mega"; FX.text(cx, p.y, "MEGA BLASTER!", "#60c0ff"); }
        Sound.play("powerup"); break;
      default: {
        const k = p.type.toUpperCase();
        P.keys[k] = true; FX.text(cx, p.y, KEY_NAMES[k] + " KEY", KEY_COLORS[k]); Sound.play("key");
      }
    }
    FX.spark(cx, p.y + p.h / 2, "#ffffff", 8, 60, 0.3, 0);
  },

  // Hero pushed against a tile: doors open with the matching key.
  touchTile(tx, ty) {
    const L = this.level, ch = L.at(tx, ty);
    if (!L.isDoor(tx, ty)) return;
    if (Player.keys[ch]) { L.openDoor(tx, ty); Sound.play("door"); }
    else if (this.lockedMsgT <= 0) {
      FX.text(Player.cx(), Player.y - 6, "NEED " + KEY_NAMES[ch] + " KEY", KEY_COLORS[ch]);
      Sound.play("locked"); this.lockedMsgT = 1.2;
    }
  },

  onPlayerDeath() {
    Player.lives--;
    if (Player.lives > 0) {
      Player.respawn();
      this.enemyShots = []; this.shots = [];
      Camera.snap(Player, this.level);
    } else {
      this.setState(STATE.GAME_OVER);
    }
  },

  onBossDefeated() {
    this.setState(STATE.VICTORY);
    FX.clear();
  },

  completeLevel() {
    const time = Math.max(0, 300 - Math.floor(this.levelTime)) * 10;
    const t = { level: CONFIG.levelBonus, health: Player.hp * 100, time: time };
    t.total = t.level + t.health + t.time; t.shown = 0; t.done = false;
    this.tally = t;
    Sound.play("oneup");
    this.setState(STATE.LEVEL_COMPLETE);
  },

  nextLevel() {
    this.addScore(this.tally.total);
    const next = this.levelIndex + 1;
    if (next < LEVEL_DATA.length) this.loadLevel(next);
    else this.setState(STATE.VICTORY);
  },

  // ---------------- update ----------------
  // The (at most 2) nearest running, on-screen petrol mowers, for the engine sound.
  engineList() {
    const pcx = Player.cx(), pcy = Player.cy(), x0 = Camera.x - 16, x1 = Camera.x + W + 16;
    return this.enemies.filter(function (e) {
      return e.type === "punk" && !e.dead && e.active && e.x + e.w > x0 && e.x < x1;
    }).map(function (e) {
      const dx = e.x + e.w / 2 - pcx, dy = e.y + e.h / 2 - pcy;
      return { id: e, state: e.state, throttle: e.state === "rev" ? 1 - e.t / CONFIG.punkRev : 0, dist: Math.sqrt(dx * dx + dy * dy) };
    }).sort(function (a, b) { return a.dist - b.dist; }).slice(0, 2);
  },
  updateEngines() {
    const playing = this.state === STATE.PLAY || this.state === STATE.BOSS;
    const list = playing && this.level ? this.engineList() : [];
    list.forEach(function (m) {                        // pull-start when a mower's engine first runs
      if (!m.id.engineStarted) { m.id.engineStarted = true; Sound.play("pullstart"); }
    });
    Sound.setEngines(list);
  },

  update(dt) {
    this.time += dt; this.stateT += dt;
    if (Input.pressed("mute")) Sound.toggleMute();
    if (Input.pressed("debug")) this.showDebug = !this.showDebug;
    if (Input.pressed("film")) Film.enabled = !Film.enabled;
    if (Fullscreen.noteT > 0) Fullscreen.noteT = Math.max(0, Fullscreen.noteT - dt);
    switch (this.state) {
      case STATE.TITLE:
        if (Input.pressed("enter")) { Sound.play("select"); this.newGame(); }
        break;
      case STATE.LEVEL_INTRO:
        if (this.stateT > introTotal(this.level.isBoss) || (this.stateT > 0.3 && (Input.pressed("enter") || Input.pressed("jump")))) {
          this.setState(this.level.isBoss ? STATE.BOSS : STATE.PLAY);
          if (this.level.isBoss) this.startReveal();
        }
        break;
      case STATE.PLAY:
      case STATE.BOSS:
        if (Input.pressed("pause") || Input.pressed("enter")) { this.setState(STATE.PAUSE); break; }
        if (this.reveal) { this.updateReveal(dt); break; }
        this.updateWorld(dt);
        break;
      case STATE.PAUSE:
        if (Input.pressed("pause") || Input.pressed("enter")) { this.state = this.prevState; this.prevState = STATE.PAUSE; }
        break;
      case STATE.LEVEL_COMPLETE: {
        const t = this.tally;
        if (!t.done) {
          t.shown = Math.min(t.total, t.shown + Math.ceil(t.total * dt / 1.5));
          if (Input.pressed("enter")) t.shown = t.total;
          if (t.shown >= t.total) t.done = true;
        } else if (Input.pressed("enter")) this.nextLevel();
        break;
      }
      case STATE.GAME_OVER:
        if (this.stateT > 1 && Input.pressed("enter")) this.setState(STATE.TITLE);
        break;
      case STATE.VICTORY:
        FX.update(dt);
        if (this.stateT > 2 && Input.pressed("enter")) { FX.clear(); this.setState(STATE.TITLE); }
        break;
    }
    this.updateEngines();
  },

  // Boss reveal (arena entry only, not on respawn): the camera pans to the boss, holds while it
  // raises its claws, and pans back to Buck. No input, no attacks; Jump/Fire skip to a short pan back.
  startReveal() {
    Camera.snap(Player, this.level);
    const xb = clamp(Boss.ox + 47 - W / 2, 0, this.level.pxW - W);     // the whole boss in view

  updateReveal(dt) {
    const R = this.reveal, C = CONFIG.reveal, ease = function (u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

    if (R.t < backAt && (Input.pressed("jump") || Input.pressed("fire"))) {          // skip

  // ---------------- render ----------------
  render() {
    switch (this.state) {
      case STATE.TITLE: Screens.title(); break;
      case STATE.LEVEL_INTRO: Screens.levelIntro(); break;
      case STATE.PLAY: case STATE.BOSS: this.renderWorld(); break;
      case STATE.PAUSE: this.renderWorld(); Screens.pause(); break;

// Pre-rendered red edge vignette for the damage flash.
const hurtVignette = (function () {
  let c = null;
  return function () {
    if (c) return c;

const mirrorCache = (function () {

// ---------------- main loop (fixed 60 Hz timestep) ----------------
let lastTime = 0, acc = 0, upsCount = 0, fpsCount = 0, rateT = 0;
function frame(now) {
  let d = lastTime ? (now - lastTime) / 1000 : 0;
  lastTime = now;
  if (d > 0.25) d = 0.25;                 // avoid spiral after tab switch
  acc += d; rateT += d;
  // An update may run up to a quarter step early (acc carries the difference, so the
  // average stays exactly 60/s): refresh timestamps jitter around 1/60 s, and without
  // this slack a 60 Hz display alternates 0 and 2 updates per refresh.
  let stepped = 0;
  while (acc >= DT * 0.75) {
    Game.update(DT);
    Input.endStep();
    acc -= DT; upsCount++; stepped++;
  }
  // draw only when the state changed: a 120/144 Hz display would otherwise draw (and
  // film-filter) the same state 2-3 times
  if (stepped > 0) {
    Game.render();
    present();
    fpsCount++;
  }
  if (Touch.on) Touch.tick();
  if (rateT >= 1) { Game.ups = upsCount; Game.fps = fpsCount; upsCount = fpsCount = 0; rateT -= 1; }
  if (!Game.headless) requestAnimationFrame(frame);
}

// Start level from the URL fragment: "level=N" (N = 1..number of levels, the reel number) as
// its own parameter, e.g. "#level=4" or "#debug&level=3". Returns the 0-based level index;
// 0 (level 1) when it is missing or invalid.
function startLevelFromHash(hash) {
  const m = /(?:^#|[#&])level=(\d+)(?:&|$)/.exec(hash || "");
  const n = m ? parseInt(m[1], 10) : 0;
  return n >= 1 && n <= LEVEL_DATA.length ? n - 1 : 0;
}

function boot() {
  Touch.init();             // touch mode on phones / #touch (src/touch.js)
  loadAssets(function () {
    buildSprites();
    booted = true;
    window.BUCK = { Game: Game, Player: Player, Boss: Boss, Input: Input, Sound: Sound, CONFIG: CONFIG, Camera: Camera, FX: FX };
    if (location.hash.indexOf("debug") >= 0) Game.showDebug = true;
    if (location.hash.indexOf("test") >= 0 && typeof runTests === "function") { runTests(); return; }
    const shot = location.hash.match(/shot=([\w.,]+)/);
    if (shot && typeof runShot === "function") { runShot(shot[1]); return; }
    requestAnimationFrame(frame);
  });
}

  safe("fullscreen", function () {
    // stub the Fullscreen and Keyboard Lock APIs (headless Chrome can't really go fullscreen)
    // desktop behaviour: touch mode skips the Windows-key lock, so these run with it off
    const touchOn = Touch.on; if (touchOn) Touch.disable();
    const de = document.documentElement, calls = [];
    let fsEl = null;
    const realReq = de.requestFullscreen, realExit = document.exitFullscreen;
    const fsDesc = Object.getOwnPropertyDescriptor(Document.prototype, "fullscreenElement");
    const kbDesc = Object.getOwnPropertyDescriptor(Navigator.prototype, "keyboard");
    Object.defineProperty(document, "fullscreenElement", { configurable: true, get: function () { return fsEl; } });
    de.requestFullscreen = function () { calls.push("request"); fsEl = de; document.dispatchEvent(new Event("fullscreenchange")); return Promise.resolve(); };
    document.exitFullscreen = function () { calls.push("exit"); fsEl = null; document.dispatchEvent(new Event("fullscreenchange")); return Promise.resolve(); };
    const sync = { then: function (ok) { ok(); } };       // resolves at once, so the test stays synchronous
    function setKeyboard(kb) { Object.defineProperty(navigator, "keyboard", { configurable: true, get: function () { return kb; } }); }
    setKeyboard({ lock: function (codes) { calls.push("lock:" + codes.join("+")); return sync; }, unlock: function () { calls.push("unlock"); } });
    function key(code, type) { window.dispatchEvent(new KeyboardEvent(type || "keydown", { code: code, key: code })); }
    try {
      Fullscreen.noteT = 0;
      key("KeyF"); key("KeyF", "keyup");
      check("fullscreen: F requests fullscreen and locks exactly the Windows keys", calls[0] === "request" && calls[1] === "lock:MetaLeft+MetaRight" && Fullscreen.isFull(), calls.join(","));
      check("fullscreen: note says the Windows key is locked", Fullscreen.noteT > 0 && Fullscreen.note === "WINDOWS KEY LOCKED", Fullscreen.note);
      // Windows key while locked: held fire stays held, the game keeps firing
      load(grid(40, 12, [[5, 9, "P"]])); Game.godMode = true;
      key("KeyX"); Game.stats.shots = 0;
      key("MetaLeft"); steps(10); key("MetaLeft", "keyup"); steps(20);
      const held = Input.down("fire"), shots = Game.stats.shots;
      key("KeyX", "keyup"); Game.godMode = false;
      check("fullscreen: the Windows key leaves held fire alone and firing continues", held && shots >= 2, "held " + held + ", shots " + shots);
      calls.length = 0;
      key("KeyF"); key("KeyF", "keyup");
      check("fullscreen: F again leaves fullscreen and unlocks the keys", calls[0] === "exit" && calls[1] === "unlock" && !Fullscreen.isFull(), calls.join(","));
      // a browser without Keyboard Lock: fullscreen still works, the note says so
      setKeyboard(undefined); calls.length = 0;
      key("KeyF"); key("KeyF", "keyup");
      check("fullscreen: without Keyboard Lock it still goes fullscreen and says the key can't be locked",
        calls[0] === "request" && Fullscreen.note === "FULLSCREEN (WINDOWS KEY NOT LOCKABLE HERE)", Fullscreen.note);
      document.exitFullscreen();
      Game.render();                     // note drawing smoke test
    } finally {
      delete document.fullscreenElement; if (fsDesc) Object.defineProperty(Document.prototype, "fullscreenElement", fsDesc);
      delete navigator.keyboard; if (kbDesc) Object.defineProperty(Navigator.prototype, "keyboard", kbDesc);
      de.requestFullscreen = realReq; document.exitFullscreen = realExit;
      Fullscreen.noteT = 0; Input.reset();
      if (touchOn) Touch.enable();
    }
  });

  safe("music scheduler", function () {
    // Drive the real scheduler with a fake clock and record the lead-voice note onsets.
    const realAc = Sound.ac, realTone = Sound.tone, realSweep = Sound.sweep, realNoise = Sound.noise;
    const clock = { currentTime: 0 };
    const lead = [];
    Sound.ac = clock;
    Sound.tone = function (type, f, t, dur, vol, dest) { if (vol === 0.22) lead.push({ t: t, f: f, d: dur }); };
    Sound.sweep = function () {}; Sound.noise = function () {};
    const realTrack = Sound.track;
    Sound.track = "valkyries";
    Sound.playing = true; Sound.step = 0; Sound.nextTime = 0; Sound.setTempo(1);
    function run(seconds) { for (let t = 0; t < seconds; t += 0.025) { clock.currentTime += 0.025; Sound.schedule(); } }
    const loopLen = SONG.steps * Sound.sixteenth;
    run(loopLen * 2 + 1);
    // expected opening (B minor Valkyrie figure): B4 F#4 B4 D5 B4 | D5 B4 D5 F#5 D5
    const want = ["B4", "F#4", "B4", "D5", "B4", "D5", "B4", "D5", "F#5", "D5"].map(function (n) { return midiHz(NOTE[n]); });
    const got = lead.slice(0, 10).map(function (n) { return n.f; });
    check("music: melody opens with the Valkyrie figure (B4 F#4 B4 D5 ...)", want.every(function (f, i) { return Math.abs(f - got[i]) < 0.01; }));
    const second = lead.filter(function (n) { return n.t >= loopLen - 1e-6; });
    const seamless = Math.abs(second[0].t - loopLen) < 1e-6 && Math.abs(second[0].f - got[0]) < 0.01;
    // no gaps: each note starts exactly where the previous one ended (in sixteenths)
    let gaps = 0;
    for (let i = 1; i < 76 * 2; i++) {
      const prev = lead[i - 1], cur = lead[i];
      const expected = prev.t + Math.round(prev.d / 0.92 / Sound.sixteenth) * Sound.sixteenth;
      if (Math.abs(cur.t - expected) > 1e-6) gaps++;
    }
    check("music: loops seamlessly without gaps", seamless && gaps === 0, "seamless " + seamless + ", gaps " + gaps);
    lead.length = 0; Sound.step = 0; Sound.nextTime = clock.currentTime; Sound.setTempo(1.25);
    run(5);
    const dt = lead[1].t - lead[0].t;

// Fixed benchmark scenes for the brightness/colour checks (runShot specs).
const BENCH_SCENES = [
  { name: "title", spec: "title" },
  { name: "L1 courts", spec: "play,0,40,13,60" },
  { name: "L2 creek bank", spec: "play,1,12,26,60" },
  { name: "L3 clubhouse", spec: "play,2,30,12,60" },
  { name: "L3 hall", spec: "play,2,120,18,60" },
  { name: "boss arena", spec: "boss,3,3,12,200" },
];

// Screenshot mode for visual checks: #shot=<state>,<level>,<tileX>,<tileY>,<steps>
// e.g. #shot=play,0,40,13,30  or  #shot=title  or  #shot=boss,3,5,12,400
function runShot(spec) {
  const p = spec.split(",");
  const what = p[0];
  if (spec.indexOf("nofilm") >= 0) Film.enabled = false;
  Game.headless = true;
  Input.reset();
  if (what === "sprites") {            // sprite sheet debug screen
    fillRect(0, 0, W, H, "#3a4a6a");
    const H_ = SPR.hero;
    const frames = [H_.idle, H_.run[0], H_.run[1], H_.run[2], H_.jump, H_.shoot, H_.shootJump, H_.hurt, H_.climb[0], H_.climb[1], H_.kneel, H_.kneelShoot, SPR.heroCutter.kneel];
    frames.forEach(function (s, i) { ctx.drawImage(s.r, 4 + i * 24, 4); ctx.drawImage(s.l, 4 + i * 24, 40); });
    [SPR.lawyer[0], SPR.lawyer[1], SPR.lawyerThrow, SPR.cray[0], SPR.cray[1], SPR.punk.walk[0], SPR.punk.walk[1], SPR.punk.rev].forEach(function (s, i) {
      ctx.drawImage(s.r, 4 + i * 30, 80); ctx.drawImage(s.fl, 4 + i * 30, 116);
    });
    [SPR.ball, SPR.trophy, SPR.rivella, SPR.cervelat, SPR.life, SPR.megagun, SPR.keys.R, SPR.keys.U, SPR.keys.G, SPR.lawbook[0][0].r,
     SPR.bubble, SPR.shot, SPR.shotUp, SPR.blasterIcon, SPR.megaIcon, IMG.head, SPR.headBack].forEach(function (img, i) {
      ctx.drawImage(img, 4 + i * 18, 156);
    });
    // clubhouse props + furniture (right half of the sheet's lower area)
    let pxs = 4;
    ["c", "i", "q", "N", "$", "p", "x", "j"].forEach(function (ch) { const c = propCanvas(ch, 0); ctx.drawImage(c, 160 + (pxs - 4), 120); pxs += c.width + 2; });
    const tsI = buildTileset("hall");
    [tsI.wallpaper[0], tsI.wainscot, tsI.counter, tsI.table].forEach(function (img, i) { ctx.drawImage(img, 160 + i * 18, 138); });
    ctx.drawImage(tsI.counterTaps, 236, 130);
    [tsI.crateSturdy, tsI.crate, tsI.crateCracked].forEach(function (img, i) { ctx.drawImage(img, 262 + i * 18, 138); });   // cover crates
    SPR.barGuys.forEach(function (g, i) { ctx.drawImage(g.idle.r, 160 + i * 20, 92); ctx.drawImage(g.drink.r, 160 + i * 20, 60); });
    ctx.drawImage(SPR.waitress.walk[0].r, 222, 62); ctx.drawImage(SPR.waitress.pour.r, 240, 62);
    ctx.drawImage(SPR.megaCutter, 262, 100); ctx.drawImage(SPR.megaBlade[0], 284, 100); ctx.drawImage(SPR.megaBlade[2], 302, 100);   // Mega Cutter
    const ts = buildTileset("court"), ts2 = buildTileset("creek"), ts3 = buildTileset("hall");
    [ts, ts2, ts3].forEach(function (t, j) {
      [t.solidTop[0], t.solidTop[1], t.solidTop[2], t.solid[1], t.alt[2], t.plat[2], t.ladder, t.water[0], t.waterTop[0], t.door.R, t.door.U, t.door.G, t.deco.n, t.deco.f,
       t.deco.lTop, t.deco.b, t.deco.v].forEach(function (img, i) { ctx.drawImage(img, 4 + i * 20, 180 + j * 19); });
    });
    present();
    return;
  }
  if (what === "cheer") {              // #shot=cheer,<level>,<fan>: Buck next to a fan who is cheering him
    Player.resetForGame(); Game.score = 4200; Game.loadLevel(+p[1] || 0);
    Game.setState(Game.level.isBoss ? STATE.BOSS : STATE.PLAY); Game.godMode = true;
    const f = Fans.list[+p[2] || 0];
    Player.x = f.x - 40; Player.y = f.y + FAN_H - 1 - Player.h; Player.face = 1; Camera.snap(Player, Game.level);
    for (let i = 0; i < 20; i++) { Game.update(DT); Input.endStep(); }
    Fans.react(f.x + FAN_W / 2, f.y + 10, "kill");
    for (let i = 0; i < 12; i++) { Game.update(DT); Input.endStep(); }
    Game.render(); present();
    return;
  }
  if (what === "fans") {               // all fan looks: idle, wave, jump, kiss (facing right), 4 looks per row
    fillRect(0, 0, W, H, "#5a8a40");
    SPR.fans.forEach(function (f, i) {
      FAN_FRAMES.forEach(function (fr, j) {
        ctx.drawImage(f[fr].r, 2 + (i % 4) * 80 + j * 19, 2 + Math.floor(i / 4) * 36);
      });
    });
    present();
    return;
  }
  if (what === "title" || what === "gameover" || what === "victory") {
    Game.setState(what === "title" ? STATE.TITLE : what === "gameover" ? STATE.GAME_OVER : STATE.VICTORY);
    Game.stateT = 3; Game.score = 123450;
    for (let i = 0; i < 30; i++) Game.update(DT);
  } else {
    Player.resetForGame(); Game.score = 4200;
    Game.loadLevel(+p[1] || 0);
    if (what === "intro") { Game.stateT = +p[2] || 0; Game.render(); present(); return; }
    Game.setState(Game.level.isBoss ? STATE.BOSS : STATE.PLAY);
    Game.godMode = true;
    if (p[2]) { Player.x = +p[2] * TILE; Player.y = +p[3] * TILE; Camera.snap(Player, Game.level); }
    const n = +p[4] || 30;
    if (what === "kneelfire") Input.simulate("down", true);
    for (let i = 0; i < n; i++) {
      if ((what === "fire" || what === "kneelfire") && i % 10 === 0) Player.fire();
      Game.update(DT); Input.endStep();
    }
    if (what === "complete") { Game.completeLevel(); for (let i = 0; i < 200; i++) Game.update(DT); }
    if (what === "pause") Game.setState(STATE.PAUSE);
  }
  Game.render();
  present();
}

boot();

})();
</script>
