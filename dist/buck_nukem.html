      case "cheer": {     // a few fans: rising "woo", crowd noise swell, two-note whistle
        const k = 0.95 + Math.random() * 0.1;
        this.sweep("sine", 320 * k, 560 * k, t, 0.45, 0.12); this.sweep("triangle", 400 * k, 660 * k, t + 0.04, 0.4, 0.08);
        this.noise(t, 0.6, 0.12, 2400, null, 1200);
        this.tone("square", 1600 * k, t + 0.1, 0.08, 0.05); this.tone("square", 2100 * k, t + 0.2, 0.14, 0.05);
        break;
      }
      case "whistle": {   // wolf whistle: a quick rising "whee", then a long rise-and-fall "whee-oo"
        const k = 0.96 + Math.random() * 0.08;
        this.sweep("sine", 1100 * k, 2300 * k, t, 0.16, 0.1);
        this.sweep("sine", 1300 * k, 2500 * k, t + 0.28, 0.14, 0.1);
        this.sweep("sine", 2500 * k, 1050 * k, t + 0.42, 0.42, 0.1);
        break;
      }
      case "pullstart":   // petrol mower: rope pull, three sputters, then the engine catches
        this.noise(t, 0.22, 0.22, 600, null, 2600);
        [0.3, 0.42, 0.56].forEach(function (d, i) {
          Sound.tone("square", 55 + i * 6, t + d, 0.06, 0.22); Sound.noise(t + d, 0.05, 0.18, 1400);
        });
        this.sweep("sawtooth", 45, 70, t + 0.7, 0.35, 0.2); this.noise(t + 0.7, 0.3, 0.12, 800); break;
      case "rev":         // throttle blips: rising two-stroke bursts with exhaust crackle
        for (let i = 0; i < 5; i++) {
          this.sweep("sawtooth", 60 + i * 20, 110 + i * 35, t + i * 0.1, 0.09, 0.22);
          this.sweep("square", 30 + i * 10, 55 + i * 18, t + i * 0.1, 0.09, 0.1);
        }
        this.noise(t, 0.5, 0.18, 700); break;
      case "mower":       // full-throttle roar as the charge starts (the engine loop carries on)
        this.sweep("sawtooth", 110, 150, t, 0.5, 0.3); this.sweep("square", 55, 75, t, 0.5, 0.18); this.noise(t, 0.5, 0.25, 2200, null, 900); break;
      case "choke":       // the engine sputters and dies
        [0, 0.09, 0.2, 0.34, 0.52].forEach(function (d, i) {
          Sound.sweep("sawtooth", 120 - i * 15, 60 - i * 8, t + d, 0.07, 0.24 - i * 0.035);
        });
        this.noise(t + 0.6, 0.25, 0.15, 500, null, 120); break;
      case "leap": this.sweep("square", 300, 700, t, 0.08, 0.12); break;
      case "slam": this.noise(t, 0.6, 1.0, 1200, null, 80); this.sweep("sine", 70, 25, t, 0.6, 0.9); break;
      case "bubble": this.sweep("sine", 300, 900, t, 0.1, 0.3); break;
      case "checkpoint": this.tone("square", 784, t, 0.1, 0.2); this.tone("square", 1047, t + 0.1, 0.2, 0.2); break;
      case "die": this.sweep("square", 600, 50, t, 0.9, 0.35); break;
      case "bosshurt": this.sweep("square", 200, 80, t, 0.12, 0.35); break;
      case "select": this.tone("square", 880, t, 0.05, 0.2); break;
      case "grinder":   // disc cutter: high-pitched grinder whine with a gritty edge
        this.sweep("sawtooth", 900, 2600, t, 0.25, 0.16); this.sweep("square", 1800, 3400, t, 0.2, 0.06); this.noise(t, 0.25, 0.18, 6000, null, 2500); break;
    }
  },
};

Input.anyKeyListeners.push(function () {
  Sound.unlock();
  if (!Sound.playing && Sound.wantMusic !== false) Sound.startMusic();
});

// ---- level.js ----
// Tile world. Maps are ASCII (see README.md for the legend), embedded by the build
// from src/levels/*.txt. Tiles are 16x16 and drawn procedurally per theme.
//
//  .  empty           #  solid          B  solid (alt)     =  one-way platform
//  H  ladder          ~  water (hurts)  R U G  locked door (red/blue/green)
//  r u g  key card    C  checkpoint     E  exit            P  player start
//  L  lawyer          K  crayfish       M  gardener-punk   X  boss
//  o  tennis ball     t  trophy         h  Rivella         s  Cervelat
//  +  extra life      w  weapon power-up
//  O  bar guy (seated regular)   W  waitress (behind the counter)   I  Einsiedler sign (4x1 prop)
//  D  sturdy crate (solid, indestructible)   d  breakable crate (solid, CRATE_HP strength)
//  n  net  f  fence  l  lamp  b  bush  v  window   (background decoration)
//  Clubhouse: a bar counter, A counter with taps, T table (one-way platforms);
//  props (decoration, anchored top-left): c chair, i stool, q bottle shelf, N neon sign,
//  $ cash register, Z trophy cabinet, m menu board, k kitchen pass, p picture,
//  x rackets, j hanging lamp, y plant, Y club plaque. Header "interior: x0-x1" gives
//  the column range drawn with the clubhouse wall backdrop instead of the photo.

const SOLID_CH = "#BRUGDd";
const CRATE_HP = 6;               // breakable crate strength (blaster 1, blade 3, shockwave 3)
const DECO_CH = "nflbv";
const PLATFORM_CH = "=aAT";
const ENTITY_CH = "PLKMXortuhsg+wCEFOW";   // O bar guy, W waitress (clubhouse bar)

// Water palettes: clear blue by default, toxic red in the Krebsbach creek.
const WATER_BLUE = { deep: "rgba(40,110,200,0.88)", mid: "rgba(120,190,255,0.6)", surface: "#cfe8ff",
  splash: "#9fd0ff", bubble: "#cfe8ff", glow: null };
const WATER_TOXIC = { deep: "rgba(120,8,8,0.92)", mid: "#b81c10", glint: "#ff6a30", surface: "#ff7a3a",
  splash: "#ff4020", bubble: "#ffd070", glow: "255,40,20" };
const THEMES = {
  court: { solid: "#bc5a2e", solid2: "#9a4424", top: "#e8783e", line: "#f2ead8", alt: "#9c9ca6", alt2: "#70707c",
           plat: "#34a852", plat2: "#1e6e36" },
  creek: { solid: "#93602e", solid2: "#734820", top: "#52c03c", line: "#2e8a24", alt: "#a0a094", alt2: "#6e6e64",
           plat: "#b87c38", plat2: "#7e5024", water: WATER_TOXIC },
  hall:  { solid: "#a84c30", solid2: "#783222", top: "#dca452", line: "#946430", alt: "#8c9ab0", alt2: "#5c6880",
           plat: "#dc6a2a", plat2: "#904414" },
};

function buildTileset(themeName) {
  const T = THEMES[themeName];
  const rng = makeRng(themeName.length * 7919);
  function tile(draw) { const c = makeCanvas(TILE, TILE); draw(c.getContext("2d")); return c; }
  function noise(g, base, dark, density) {
    g.fillStyle = base; g.fillRect(0, 0, TILE, TILE);
    g.fillStyle = dark;
    for (let i = 0; i < density; i++) g.fillRect(Math.floor(rng() * TILE), Math.floor(rng() * TILE), 1, 1);
  }
  const ts = {};
  // Worn variants: 0 clean, 1 cracked, 2 grimy (rusty on hall metal). Chosen per tile
  // by a stable hash of (tx, ty) so surfaces don't repeat uniformly.
  function wear(g, v, rust) {
    if (v === 1) {                                   // cracks: jagged dark lines
      g.fillStyle = "rgba(10,6,4,0.75)";
      for (let k = 0; k < 2; k++) {
        let x = 2 + Math.floor(rng() * 12), y = Math.floor(rng() * 6);
        for (let n = 0; n < 9; n++) {
          g.fillRect(x, y, 1, 1);
          x += Math.floor(rng() * 3) - 1; y += 1;
          if (x < 0 || x > 15 || y > 15) break;
        }
      }
    } else if (v === 2) {                            // grime / rust blotches
      for (let k = 0; k < 3; k++) {
        const cx = Math.floor(rng() * 16), cy = Math.floor(rng() * 16), r = 1 + Math.floor(rng() * 3);
        pxEllipse(g, cx, cy, r + 1, r, rust ? "rgba(140,64,20,0.55)" : "rgba(20,12,6,0.4)");
      }
      g.fillStyle = rust ? "rgba(170,90,30,0.6)" : "rgba(0,0,0,0.35)";
      for (let i = 0; i < 10; i++) g.fillRect(Math.floor(rng() * 16), Math.floor(rng() * 16), 1, 1);
    }
  }
  function solidBase(g) {
    noise(g, T.solid, T.solid2, 40);
    if (themeName === "hall") { // bricks
      g.fillStyle = T.solid2;
      for (let y = 0; y < 16; y += 4) { g.fillRect(0, y, 16, 1); const o = (y / 4) % 2 ? 0 : 8; g.fillRect(o, y, 1, 4); }
    }
  }
  function solidTopDeco(g) {
    g.fillStyle = T.top; g.fillRect(0, 0, 16, 4);
    if (themeName === "court") { g.fillStyle = T.line; g.fillRect(0, 1, 16, 1); }
    else if (themeName === "creek") {
      g.fillStyle = T.line;
      for (let x = 0; x < 16; x += 3) g.fillRect(x, 4, 1, 1 + Math.floor(rng() * 3));
      g.fillStyle = "#6aa848"; for (let x = 1; x < 16; x += 4) g.fillRect(x, 0, 1, 1);
    } else { g.fillStyle = T.line; g.fillRect(0, 3, 16, 1); g.fillRect(5, 0, 1, 3); g.fillRect(12, 0, 1, 3); }
  }
  function altBase(g) {
    noise(g, T.alt, T.alt2, 30);
    g.fillStyle = T.alt2; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
    g.fillStyle = "#a0a0a4"; g.fillRect(0, 0, 15, 1); g.fillRect(0, 0, 1, 15);
    if (themeName === "hall") { g.fillStyle = "#c0c2c8"; [[3, 3], [12, 3], [3, 12], [12, 12]].forEach(function (p) { g.fillRect(p[0], p[1], 1, 1); }); }
  }
  function platBase(g) {
    g.fillStyle = T.plat; g.fillRect(0, 0, 16, 5);
    g.fillStyle = T.plat2; g.fillRect(0, 4, 16, 1); g.fillRect(2, 5, 2, 3); g.fillRect(12, 5, 2, 3);
    g.fillStyle = "rgba(255,255,255,0.25)"; g.fillRect(0, 0, 16, 1);
  }
  function platWear(g, v) {
    if (v === 1) { g.fillStyle = "rgba(10,6,4,0.7)"; const x = 3 + Math.floor(rng() * 10); g.fillRect(x, 0, 1, 3); g.fillRect(x + 1, 2, 1, 2); }
    else if (v === 2) { g.fillStyle = themeName === "creek" ? "rgba(20,12,6,0.45)" : "rgba(140,64,20,0.6)";
      for (let i = 0; i < 6; i++) g.fillRect(Math.floor(rng() * 16), Math.floor(rng() * 4), 2, 1); }
  }
  const metal = themeName === "hall";
  ts.solid = [0, 1, 2].map(function (v) { return tile(function (g) { solidBase(g); wear(g, v, false); }); });
  ts.solidTop = [0, 1, 2].map(function (v) { return tile(function (g) { solidBase(g); wear(g, v, false); solidTopDeco(g); }); });
  ts.alt = [0, 1, 2].map(function (v) { return tile(function (g) { altBase(g); wear(g, v, metal); }); });
  ts.plat = [0, 1, 2].map(function (v) { return tile(function (g) { platBase(g); platWear(g, v); }); });
  // cover crates (boss arena): wooden planks with a dark outline; sturdy ones with metal
  // bands and rivets; breakable ones get a cracked variant once half their strength is gone
  function crateBase(g) {
    g.fillStyle = "#a8743a"; g.fillRect(1, 1, 14, 14);
    g.fillStyle = "#c8904a"; for (let y = 1; y < 15; y += 5) g.fillRect(1, y, 14, 1);       // plank highlights
    g.fillStyle = "#6e4420"; for (let y = 5; y < 15; y += 5) g.fillRect(1, y, 14, 1);       // plank seams
    g.fillStyle = "#8a5a2a"; for (let i = 0; i < 12; i++) g.fillRect(2 + i, 2 + i, 1, 1);  // diagonal brace
    for (let i = 0; i < 12; i++) g.fillRect(3 + i, 2 + i, 1, 1);
    g.fillStyle = "rgb(" + OUTLINE_COLOR.join(",") + ")";
    g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16);
  }
  ts.crateSturdy = tile(function (g) {
    crateBase(g);
    g.fillStyle = "#8c949e"; g.fillRect(1, 2, 14, 2); g.fillRect(1, 12, 14, 2); g.fillRect(2, 1, 2, 14); g.fillRect(12, 1, 2, 14);
    g.fillStyle = "#c8d0d8"; g.fillRect(1, 2, 14, 1); g.fillRect(1, 12, 14, 1);
    g.fillStyle = "#3a404e"; [[2, 3], [12, 3], [2, 13], [12, 13], [7, 3], [7, 13]].forEach(function (p) { g.fillRect(p[0], p[1], 1, 1); });
  });
  ts.crate = tile(crateBase);
  ts.crateCracked = tile(function (g) {
    crateBase(g);
    g.fillStyle = "#2a160a";
    [[9, 1], [9, 2], [8, 3], [8, 4], [9, 5], [10, 6], [10, 7], [9, 8], [4, 9], [5, 10], [5, 11], [6, 12], [6, 13], [3, 6], [4, 7]].forEach(function (p) { g.fillRect(p[0], p[1], 1, 1); });
    g.fillStyle = "#5a3818"; g.fillRect(11, 10, 3, 2); g.fillRect(2, 2, 2, 2);             // splintered gaps
  });
  // clubhouse interior tiles (theme independent)
  ts.wallpaper = [0, 1].map(function (v) {
    return tile(function (g) {
      g.fillStyle = "#a8404e"; g.fillRect(0, 0, 16, 16);
      g.fillStyle = "#cc6474";                                  // damask diamonds
      for (let i = 0; i < 4; i++) { g.fillRect(8 - i, 2 + i, 1 + i * 2, 1); g.fillRect(8 - i, 9 - i, 1 + i * 2, 1); }
      g.fillStyle = "#d8b060"; g.fillRect(v ? 1 : 15, 13, 1, 1); g.fillRect(8, 5, 1, 1);
      g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(0, 0, 1, 16);
    });
  });
  ts.wainscot = tile(function (g) {
    g.fillStyle = "#9c6230"; g.fillRect(0, 0, 16, 16);
    g.fillStyle = "#b87a3c"; for (let x = 0; x < 16; x += 4) g.fillRect(x, 3, 3, 11);
    g.fillStyle = "#e0a85a"; g.fillRect(0, 1, 16, 2);           // dado rail
    g.fillStyle = "#2a1a0c"; g.fillRect(0, 14, 16, 2);          // skirting board
  });
  ts.counter = tile(function (g) {
    g.fillStyle = "#a8743c"; g.fillRect(0, 0, 16, 3);          // polished top
    g.fillStyle = "#d8a860"; g.fillRect(0, 0, 16, 1);
    g.fillStyle = "#4a2a12"; g.fillRect(0, 3, 16, 13);         // front panels
    g.fillStyle = "#5e3818"; g.fillRect(1, 5, 6, 9); g.fillRect(9, 5, 6, 9);
    g.fillStyle = "#c8a040"; g.fillRect(0, 13, 16, 1);         // brass foot rail
  });
  // Einsiedler tap tower (16x28, 12 px above the counter): chrome column and crossbar,
  // 3 tall red/white striped tap handles with a little red shield, spouts and a drip tray
  ts.counterTaps = (function () {
    const c = makeCanvas(TILE, TILE + 12), g = c.getContext("2d");
    g.drawImage(ts.counter, 0, 12);
    g.fillStyle = "#101018"; g.fillRect(1, 6, 14, 4);            // crossbar outline
    g.fillStyle = "#c8ccd4"; g.fillRect(2, 7, 12, 2);            // chrome crossbar
    g.fillStyle = "#f0f4f8"; g.fillRect(2, 7, 12, 1);
    g.fillStyle = "#8a8e98"; g.fillRect(7, 9, 2, 3);             // column into the counter
    [3, 7, 11].forEach(function (x) {
      g.fillStyle = "#101018"; g.fillRect(x - 1, 0, 4, 7);       // handle outline
      for (let y = 1; y < 6; y++) { g.fillStyle = y % 2 ? "#d01818" : "#f4f0e8"; g.fillRect(x, y, 2, 1); }   // red/white stripes
      g.fillStyle = "#e02020"; g.fillRect(x, 0, 2, 1);           // shield cap
      g.fillStyle = "#ffffff"; g.fillRect(x, 3, 1, 1);           // tiny white cross on the shield
      g.fillStyle = "#9a9ea8"; g.fillRect(x, 9, 2, 2);           // spout
    });
    g.fillStyle = "#3a3e48"; g.fillRect(1, 11, 14, 1);           // drip tray
    g.fillStyle = "#6a6e78"; g.fillRect(2, 11, 12, 1);
    return c;
  })();
  // counter variants: a beer on a beer mat, two beer mats (plain counter stays variant 0)
  ts.counterGlass = (function () {
    const c = makeCanvas(TILE, TILE + 6), g = c.getContext("2d");
    g.drawImage(ts.counter, 0, 6);
    g.fillStyle = "#101018"; g.fillRect(4, 0, 6, 7);             // glass outline
    g.fillStyle = "#d8902a"; g.fillRect(5, 2, 4, 4);             // amber beer
    g.fillStyle = "#f8f4e8"; g.fillRect(5, 1, 4, 1);             // foam
    g.fillStyle = "#ffd070"; g.fillRect(5, 3, 1, 2);             // highlight
    g.fillStyle = "#f0e8d0"; g.fillRect(3, 6, 8, 1);             // beer mat
    g.fillStyle = "#c81e1e"; g.fillRect(6, 6, 2, 1);
    return c;
  })();
  ts.counterMats = tile(function (g) {
    g.drawImage(ts.counter, 0, 0);
    g.fillStyle = "#f0e8d0"; g.fillRect(2, 0, 5, 1); g.fillRect(10, 0, 5, 1);   // two beer mats
    g.fillStyle = "#c81e1e"; g.fillRect(4, 0, 1, 1); g.fillRect(12, 0, 1, 1);
  });
  ts.table = tile(function (g) {
    for (let x = 0; x < 16; x += 2) {                             // red/white checked cloth
      g.fillStyle = (x / 2) % 2 ? "#e8e0d0" : "#b01818"; g.fillRect(x, 0, 2, 2);
      g.fillStyle = (x / 2) % 2 ? "#b01818" : "#e8e0d0"; g.fillRect(x, 2, 2, 2);
      g.fillStyle = (x / 2) % 2 ? "#e8e0d0" : "#b01818"; g.fillRect(x, 4, 2, 2);
    }
    g.fillStyle = "#8a5a2a"; g.fillRect(2, 6, 2, 10); g.fillRect(12, 6, 2, 10);   // legs
  });
  ts.ladder = tile(function (g) {
    g.fillStyle = "#c0c4cc"; g.fillRect(2, 0, 2, 16); g.fillRect(12, 0, 2, 16);
    g.fillStyle = "#808490"; g.fillRect(4, 3, 8, 2); g.fillRect(4, 11, 8, 2);
  });
  const WP = T.water || WATER_BLUE;
  ts.waterPalette = WP;
  ts.water = [0, 1, 2, 3].map(function (f) {
    return tile(function (g) {
      g.fillStyle = WP.deep; g.fillRect(0, 0, 16, 16);
      g.fillStyle = WP.mid;
      for (let i = 0; i < 4; i++) g.fillRect((i * 5 + f * 2) % 16, (i * 4 + 2) % 16, 3, 1);
      if (WP.glint) {                                   // rising toxic bubbles (move per frame)
        g.fillStyle = WP.glint;
        g.fillRect((3 + f * 4) % 15, 12 - f * 3, 1, 1);
        g.fillRect((10 + f * 3) % 15, 14 - ((f * 5) % 12), 2, 1);
      }
    });
  });
  ts.waterTop = [0, 1, 2, 3].map(function (f) {
    return tile(function (g) {
      g.drawImage(ts.water[f], 0, 0);
      g.clearRect(0, 0, 16, 4);
      for (let x = 0; x < 16; x++) {
        const y = 2 + Math.round(Math.sin((x + f * 4) / 16 * Math.PI * 2) * 1.2); // 1..3
        g.fillStyle = WP.deep; g.fillRect(x, y + 1, 1, 4 - (y + 1));
        g.fillStyle = WP.surface; g.fillRect(x, y, 1, 1);
      }
      if (WP.glint) {                                   // bubbles popping on the surface
        const bx = (2 + f * 5) % 13, by = 3;
        g.fillStyle = WP.glint;
        if (f % 2 === 0) { g.fillRect(bx, by - 1, 2, 1); g.fillRect(bx - 1, by, 1, 1); g.fillRect(bx + 2, by, 1, 1); }
        else { g.fillRect(bx, by - 2, 1, 1); g.fillRect(bx + 2, by - 1, 1, 1); g.fillRect(bx - 1, by - 1, 1, 1); }
        g.fillRect((bx + 7) % 15, 5, 2, 2);
      }
    });
  });
  // faint glow strip above toxic surface tiles
  ts.waterGlow = null;
  if (WP.glow) {
    const c = makeCanvas(16, 6), g = c.getContext("2d");
    for (let y = 0; y < 6; y++) { g.fillStyle = "rgba(" + WP.glow + "," + (0.04 * (y + 1)).toFixed(2) + ")"; g.fillRect(0, y, 16, 1); }
    ts.waterGlow = c;
  }
  ts.door = {};
  Object.keys(KEY_COLORS).forEach(function (k) {
    ts.door[k] = tile(function (g) {
      g.fillStyle = "#30343c"; g.fillRect(0, 0, 16, 16);
      g.fillStyle = KEY_COLORS[k]; g.fillRect(2, 0, 12, 16);
      g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(2, 7, 12, 2);
      g.fillStyle = "#101018"; g.fillRect(6, 4, 4, 4); g.fillStyle = "#f0f0f0"; g.fillRect(7, 5, 2, 2);
    });
  });
  ts.deco = {
    n: tile(function (g) {
      g.fillStyle = "#f4f4f4"; g.fillRect(0, 2, 16, 2);
      g.fillStyle = "rgba(20,20,20,0.75)";
      for (let i = 0; i < 16; i += 3) { g.fillRect(i, 4, 1, 12); }
      for (let j = 6; j < 16; j += 3) g.fillRect(0, j, 16, 1);
    }),
    f: tile(function (g) {
      g.fillStyle = "rgba(40,120,70,0.8)";
      for (let i = -16; i < 16; i += 4) for (let y = 0; y < 16; y++) {
        g.fillRect(i + y, y, 1, 1); g.fillRect(i + 16 - y, y, 1, 1);
      }
      g.fillStyle = "#2a5a3a"; g.fillRect(0, 0, 16, 1);
    }),
    l: tile(function (g) { g.fillStyle = "#70747c"; g.fillRect(7, 0, 2, 16); }),
    lTop: tile(function (g) {
      g.fillStyle = "#70747c"; g.fillRect(7, 6, 2, 10); g.fillRect(3, 4, 10, 2);
      g.fillStyle = "#fff8c0"; g.fillRect(3, 6, 4, 2); g.fillRect(9, 6, 4, 2);
    }),
    b: tile(function (g) {
      pxEllipse(g, 8, 10, 8, 6, "#2e7a2a"); pxEllipse(g, 6, 9, 4, 3, "#46a03a"); pxEllipse(g, 11, 11, 3, 2, "#3a8e30");
    }),
    v: tile(function (g) {
      g.fillStyle = "#8a9098"; g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16);
      g.fillRect(7, 0, 2, 16); g.fillStyle = "rgba(180,220,255,0.15)"; g.fillRect(1, 1, 6, 14);
    }),
  };
  return ts;
}

// Stable worn-variant choice for a tile position (0 clean, 1 cracked, 2 grimy).
function tileVariant(tx, ty) {
  let h = Math.imul(tx, 73856093) ^ Math.imul(ty, 19349663);
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  const r = ((h ^ (h >>> 16)) >>> 0) % 10;
  return r < 5 ? 0 : r < 8 ? 1 : 2;
}

class Level {
  constructor(data, index) {
    this.index = index;
    this.name = data.name || "LEVEL " + (index + 1);
    this.theme = data.theme || "court";
    this.bgName = data.bg || "bg_court";
    this.isBoss = data.boss === "1";
    this.rows = data.map.map(function (r) { return r.split(""); });
    this.h = this.rows.length;
    this.w = this.rows[0].length;
    this.pxW = this.w * TILE;
    this.pxH = this.h * TILE;
    this.spawns = [];
    this.openDoors = {};
    this.crateHp = {};             // "tx,ty" -> strength of breakable crates (reset on load)
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const ch = this.rows[y][x];
      if (ENTITY_CH.indexOf(ch) >= 0) {
        this.spawns.push({ ch: ch, tx: x, ty: y });
        const l = this.rows[y][x - 1], r = this.rows[y][x + 1];
        this.rows[y][x] = (ch === "K" && (l === "~" || r === "~")) ? "~" : ".";
      }
    }
    this.tiles = buildTileset(this.theme);
    const ir = /^(\d+)-(\d+)$/.exec(data.interior || "");
    this.interior = ir ? [+ir[1], +ir[2]] : null;
    const bg = IMG[this.bgName];
    this.bgStrip = bg ? makeMirroredStrip(bg) : null;
    this.waterPalette = this.tiles.waterPalette;
  }
  at(tx, ty) {
    if (tx < 0 || tx >= this.w) return "#";       // side walls
    if (ty < 0 || ty >= this.h) return ".";
    return this.rows[ty][tx];
  }
  isSolid(tx, ty) { return SOLID_CH.indexOf(this.at(tx, ty)) >= 0; }
  isPlatform(tx, ty) { return PLATFORM_CH.indexOf(this.at(tx, ty)) >= 0; }
  inInterior(tx) { return !!this.interior && tx >= this.interior[0] && tx <= this.interior[1]; }
  isLadder(tx, ty) { return this.at(tx, ty) === "H"; }
  isLadderTop(tx, ty) { return this.isLadder(tx, ty) && !this.isLadder(tx, ty - 1); }
  isWater(tx, ty) { return this.at(tx, ty) === "~"; }
  isDoor(tx, ty) { return "RUG".indexOf(this.at(tx, ty)) >= 0; }
  isCrate(tx, ty) { const c = this.at(tx, ty); return c === "D" || c === "d"; }
  crateStrength(tx, ty) {
    if (this.at(tx, ty) !== "d") return 0;
    const k = tx + "," + ty;
    return k in this.crateHp ? this.crateHp[k] : CRATE_HP;
  }
  // Damages a breakable crate; returns true when it broke. Sturdy crates ignore damage.
  hitCrate(tx, ty, dmg) {
    if (this.at(tx, ty) !== "d") return false;
    const k = tx + "," + ty, hp = this.crateStrength(tx, ty) - dmg;
    if (hp > 0) { this.crateHp[k] = hp; return false; }
    delete this.crateHp[k];
    this.rows[ty][tx] = ".";
    const cx = tx * TILE + 8, cy = ty * TILE + 8;
    FX.gibs(cx, cy, GORE.wood, 10, false);
    FX.spark(cx, cy, "#c8904a", 10, 90, 0.5, 300);
    Sound.play("crate");
    return true;
  }
  // standable from above (for one-way collision and enemy ledge checks)
  isFloor(tx, ty) { return this.isSolid(tx, ty) || this.isPlatform(tx, ty) || this.isLadderTop(tx, ty); }

  // Opens every door tile of this colour connected to (tx, ty).
  openDoor(tx, ty) {
    const color = this.at(tx, ty);
    const stack = [[tx, ty]];
    let n = 0;
    while (stack.length) {
      const p = stack.pop();
      if (this.at(p[0], p[1]) !== color) continue;
      this.rows[p[1]][p[0]] = ".";
      n++;
      FX.spark(p[0] * TILE + 8, p[1] * TILE + 8, KEY_COLORS[color], 6, 60, 0.5);
      stack.push([p[0], p[1] - 1], [p[0], p[1] + 1], [p[0] - 1, p[1]], [p[0] + 1, p[1]]);
    }
    return n;
  }

  drawBackground(camX, camY) {
    if (!this.bgStrip) { fillRect(0, HUD_H, W, VIEW_H, "#203040"); return; }
    const sw = this.bgStrip.width;
    const ox = Math.floor((camX * 0.3) % sw);
    const maxCamY = Math.max(1, this.pxH - VIEW_H);
    const oy = HUD_H - Math.round((camY / maxCamY) * (this.bgStrip.height - VIEW_H));
    ctx.drawImage(this.bgStrip, -ox, oy);
    if (sw - ox < W) ctx.drawImage(this.bgStrip, sw - ox, oy);
    if (this.theme === "hall") fillRect(0, HUD_H, W, VIEW_H, "rgba(10,8,24,0.35)");
  }

  drawTiles(camX, camY, time, layer) {
    // props can span several tiles to the right/down of their anchor: widen the scan back
    const x0 = Math.floor(camX / TILE) - (layer === "back" ? 6 : 0), y0 = Math.floor(camY / TILE) - (layer === "back" ? 1 : 0);
    const x1 = Math.ceil((camX + W) / TILE), y1 = Math.ceil((camY + VIEW_H) / TILE);
    const ts = this.tiles;
    const wf = Math.floor(time * 6) % 4;
    if (layer === "back" && this.interior) this.drawInterior(camX, camY);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) continue;
      const ch = this.rows[ty][tx];
      const sx = tx * TILE - camX, sy = ty * TILE - camY + HUD_H;
      let img = null;
      if (layer === "back") {
        if (DECO_CH.indexOf(ch) >= 0) img = ch === "l" && this.at(tx, ty - 1) !== "l" ? ts.deco.lTop : ts.deco[ch];
        else if (ch === "H") img = ts.ladder;
        else if (PROP_DEFS[ch]) img = propCanvas(ch, time);
      } else if (layer === "main") {
        const v = tileVariant(tx, ty);
        if (ch === "#") img = this.isSolid(tx, ty - 1) && !this.isCrate(tx, ty - 1) ? ts.solid[v] : ts.solidTop[v];
        else if (ch === "D") img = ts.crateSturdy;
        else if (ch === "d") img = this.crateStrength(tx, ty) <= CRATE_HP / 2 ? ts.crateCracked : ts.crate;
        else if (ch === "B") img = ts.alt[v];
        else if (ch === "=") img = ts.plat[v];
        else if (ch === "a") {          // counter: plain, a beer on a mat, or two mats
          const cv = v % 3;
          if (cv === 1) { ctx.drawImage(ts.counterGlass, Math.round(sx), Math.round(sy) - 6); continue; }
          img = cv === 2 ? ts.counterMats : ts.counter;
        }
        else if (ch === "T") img = ts.table;
        else if (ch === "A") { ctx.drawImage(ts.counterTaps, Math.round(sx), Math.round(sy) - 12); continue; }
        else if (ts.door[ch]) img = ts.door[ch];
      } else if (layer === "water" && ch === "~") {
        const top = !this.isWater(tx, ty - 1);
        img = top ? ts.waterTop[wf] : ts.water[wf];
        if (top && ts.waterGlow) ctx.drawImage(ts.waterGlow, Math.round(sx), Math.round(sy) - 6);
      }
      if (img) ctx.drawImage(img, Math.round(sx), Math.round(sy));
    }
  }

  // Clubhouse wall backdrop (wallpaper, wainscot above floors) over the photo, for
  // every non-solid, non-water, non-window cell inside the interior column range.
  drawInterior(camX, camY) {
    const ts = this.tiles;
    const x0 = Math.max(this.interior[0], Math.floor(camX / TILE)), x1 = Math.min(this.interior[1], Math.ceil((camX + W) / TILE));
    const y0 = Math.max(0, Math.floor(camY / TILE)), y1 = Math.min(this.h - 1, Math.ceil((camY + VIEW_H) / TILE));
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const ch = this.rows[ty][tx];
      if (this.isSolid(tx, ty) || ch === "~" || ch === "v") continue;
      const img = this.isSolid(tx, ty + 1) ? ts.wainscot : ts.wallpaper[(tx + ty) % 2];
      ctx.drawImage(img, tx * TILE - camX, ty * TILE - camY + HUD_H);
    }
  }
}

// Camera with a dead zone, clamped to the level bounds.
// anchorX: where the target's centre is kept horizontally (the middle by default; the boss
// arena keeps Buck near the left edge so the view shows the arena ahead, towards the boss).
const Camera = {
  x: 0, y: 0, anchorX: W / 2,
  snap(target, level) {
    this.x = this.anchorX === W / 2 ? target.x - W / 2 : target.x + target.w / 2 - this.anchorX;
    this.y = target.y - VIEW_H / 2; this.clamp(level);
  },
  follow(target, level) {
    const cx = target.x + target.w / 2, cy = target.y + target.h / 2;
    const ax = this.anchorX, dzX = ax === W / 2 ? 24 : 12, top = 70, bottom = 140;
    const sx = cx - this.x;
    if (sx < ax - dzX) this.x = cx - (ax - dzX);
    if (sx > ax + dzX) this.x = cx - (ax + dzX);
    const sy = cy - this.y;
    if (sy < top) this.y = cy - top;
    if (sy > bottom) this.y = cy - bottom;
    this.clamp(level);
  },
  clamp(level) {
    this.x = level.pxW <= W ? (level.pxW - W) / 2 : clamp(this.x, 0, level.pxW - W);
    this.y = level.pxH <= VIEW_H ? (level.pxH - VIEW_H) / 2 : clamp(this.y, 0, level.pxH - VIEW_H);
  },
};

// Shared AABB-vs-tile movement (axis separated). Returns collision flags.
// opts: {platforms: bool (land on one-way platforms + ladder tops), dropThrough: bool}
function moveBody(b, dt, level, opts) {
  opts = opts || {};
  const res = { wallL: false, wallR: false, ground: false, ceil: false };
  // X axis
  b.x += b.vx * dt;
  const ty0 = Math.floor(b.y / TILE), ty1 = Math.floor((b.y + b.h - 1) / TILE);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 1) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) if (level.isSolid(tx, ty)) { b.x = tx * TILE - b.w; res.wallR = true; res.wallTile = [tx, ty]; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / TILE);
    for (let ty = ty0; ty <= ty1; ty++) if (level.isSolid(tx, ty)) { b.x = (tx + 1) * TILE; res.wallL = true; res.wallTile = [tx, ty]; break; }
  }
  // Y axis
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  const tx0 = Math.floor(b.x / TILE), tx1 = Math.floor((b.x + b.w - 1) / TILE);
  if (b.vy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / TILE);   // tile containing the feet
    for (let tx = tx0; tx <= tx1; tx++) {
      const top = ty * TILE;
      const oneWay = opts.platforms && !opts.dropThrough &&
        (level.isPlatform(tx, ty) || level.isLadderTop(tx, ty)) && prevBottom <= top + 0.01;
      if (level.isSolid(tx, ty) || oneWay) { b.y = top - b.h; b.vy = 0; res.ground = true; break; }
    }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y / TILE);
    for (let tx = tx0; tx <= tx1; tx++) if (level.isSolid(tx, ty)) { b.y = (ty + 1) * TILE; b.vy = 0; res.ceil = true; res.ceilTile = [tx, ty]; break; }
  }
  return res;
}

// True when the body is standing on something (used for ground checks without moving).
function standingOn(b, level, platforms) {
  const ty = Math.floor((b.y + b.h + 1) / TILE);
  const tx0 = Math.floor(b.x / TILE), tx1 = Math.floor((b.x + b.w - 1) / TILE);
  for (let tx = tx0; tx <= tx1; tx++) {
    if (level.isSolid(tx, ty)) return true;
    if (platforms && (level.isPlatform(tx, ty) || level.isLadderTop(tx, ty)) && Math.abs(b.y + b.h - ty * TILE) < 1) return true;
  }
  return false;
}

function drawTextTo(g, str, x, y, color) {
  str = String(str).toUpperCase();

}

const propCache = {};
function buildProp(ch, variant) {
  const d = PROP_DEFS[ch];
  const c = makeCanvas(d.w * TILE, d.h * TILE);
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  PROP_DRAW[ch](g, variant);
  return c;
}
// Returns the (cached) canvas for a prop; animated props pick a frame from time.
function propCanvas(ch, time) {
  const d = PROP_DEFS[ch];
  let variant = true;
  if (d.anim) {   // neon flicker: mostly on, occasional quick blinks
    const t = (time * 10) | 0;
    variant = !(t % 37 === 0 || t % 37 === 2 || t % 53 === 5);
  }
  const key = ch + (variant ? 1 : 0);
  if (!propCache[key]) propCache[key] = buildProp(ch, variant);
  return propCache[key];
}

// ---- player.js ----
// Buck Nukem: movement, ladders, kneeling, shooting, health, lives and respawn.
const STAND_H = 28, KNEEL_H = 16;      // body height standing / kneeling (feet stay put)
const Player = {
  x: 0, y: 0, w: 10, h: 28, vx: 0, vy: 0,
  face: 1, onGround: false, coyote: 0, jumping: false,
  climbing: false, climbAnim: 0,
  hp: CONFIG.maxHp, lives: CONFIG.startLives,
  invuln: 0, hurtT: 0, dead: false, deathT: 0,
  weapon: "blaster", keys: {}, fireCd: 0, shootT: 0, animT: 0,
  spawnX: 0, spawnY: 0, waterCd: 0, kneeling: false, dropT: 0,

  resetForGame() {
    this.hp = CONFIG.maxHp; this.lives = CONFIG.startLives; this.weapon = "blaster"; this.keys = {};
  },
  placeAt(px, py) {
    this.h = STAND_H; this.kneeling = false; this.dropT = 0;
    this.x = px; this.y = py; this.vx = 0; this.vy = 0;
    this.climbing = false; this.dead = false; this.onGround = false; this.jumping = false;
    this.hurtT = 0; this.fireCd = 0; this.shootT = 0;
  },
  setCheckpoint(px, py) { this.spawnX = px; this.spawnY = py; },
  cx() { return this.x + this.w / 2; },
  // Kneel down / stand up with the feet in place. Standing up needs room above the
  // kneeling body; returns false (still kneeling) when a solid tile is in the way.
  setKneel(on, level) {
    if (on === this.kneeling) return true;
    const d = STAND_H - KNEEL_H;
    if (on) { this.y += d; this.h = KNEEL_H; this.kneeling = true; return true; }
    if (level) {
      const tx0 = Math.floor(this.x / TILE), tx1 = Math.floor((this.x + this.w - 1) / TILE);
      for (let ty = Math.floor((this.y - d) / TILE); ty <= Math.floor((this.y - 1) / TILE); ty++)
        for (let tx = tx0; tx <= tx1; tx++) if (level.isSolid(tx, ty)) return false;
    }
    this.y -= d; this.h = STAND_H; this.kneeling = false;
    return true;
  },
  // standing on a one-way platform (not on solid ground)?
  onOneWay(level) {
    const ty = Math.floor((this.y + this.h + 1) / TILE);
    const tx0 = Math.floor(this.x / TILE), tx1 = Math.floor((this.x + this.w - 1) / TILE);
    let plat = false;
    for (let tx = tx0; tx <= tx1; tx++) {
      if (level.isSolid(tx, ty)) return false;
      if (level.isPlatform(tx, ty)) plat = true;
    }
    return plat;
  },
  cy() { return this.y + this.h / 2; },

  update(dt, level) {
    if (this.dead) {
      this.deathT -= dt;
      if (this.deathT <= 0) Game.onPlayerDeath();
      return;
    }
    if (this.invuln > 0) this.invuln -= dt;
    if (this.hurtT > 0) this.hurtT -= dt;
    if (this.fireCd > 0) this.fireCd -= dt;
    if (this.shootT > 0) this.shootT -= dt;
    if (this.waterCd > 0) this.waterCd -= dt;
    if (this.dropT > 0) this.dropT -= dt;

    const dir = (Input.down("right") ? 1 : 0) - (Input.down("left") ? 1 : 0);
    const ctx_ = Math.floor(this.cx() / TILE);
    const ladderBody = level.isLadder(ctx_, Math.floor((this.y + this.h - 2) / TILE)) ||
                       level.isLadder(ctx_, Math.floor(this.cy() / TILE));
    const ladderBelow = level.isLadder(ctx_, Math.floor((this.y + this.h + 2) / TILE));

    // enter ladder
    if (!this.climbing && this.hurtT <= 0) {
      if (((Input.down("up") && ladderBody) || (Input.down("down") && this.onGround && ladderBelow)) && this.setKneel(false, level)) {
        this.climbing = true; this.vx = 0; this.vy = 0;
        this.x = ctx_ * TILE + TILE / 2 - this.w / 2;
        if (!ladderBody) this.y += 3;   // step down into the ladder top
      }
    }

    if (this.climbing) {
      const v = (Input.down("down") ? 1 : 0) - (Input.down("up") ? 1 : 0);
      this.vy = v * CONFIG.climbSpeed; this.vx = 0;
      if (v) this.climbAnim += dt;
      if (dir) this.face = dir;          // Left/Right turn on the ladder (to shoot), without leaving it
      if (Input.pressed("jump")) {
        this.climbing = false;
        if (dir) { this.vy = CONFIG.jumpVel * 0.7; this.face = dir; this.jumping = true; Sound.play("jump"); }
      }
      const res = moveBody(this, dt, level, { platforms: false });
      const stillLadder = level.isLadder(ctx_, Math.floor((this.y + this.h - 1) / TILE)) ||
                          level.isLadder(ctx_, Math.floor(this.cy() / TILE));
      if (res.ground && v > 0) this.climbing = false;
      if (!stillLadder) {
        this.climbing = false;
        // reached the top: stand on the ladder top
        if (v < 0) {
          const ty = Math.floor((this.y + this.h) / TILE);
          if (level.isLadderTop(ctx_, ty)) this.y = ty * TILE - this.h;
          this.vy = 0;
        }
      }
      this.onGround = res.ground;
    } else {
      // kneel: Down on the ground (a ladder top is entered instead, above)
      if (Input.down("down") && this.onGround && !ladderBelow && this.hurtT <= 0) this.setKneel(true, level);
      else if (this.kneeling) this.setKneel(false, level);          // stays down under a low ceiling
      // horizontal (kneeling: no walking, Left/Right only turn)
      const target = (this.kneeling ? 0 : dir) * CONFIG.runSpeed;
      const a = CONFIG.accel * dt * (this.onGround ? 1 : 0.7);
      if (this.hurtT <= 0) {
        if (this.vx < target) this.vx = Math.min(target, this.vx + a);
        else if (this.vx > target) this.vx = Math.max(target, this.vx - a);
        if (dir) this.face = dir;
      }
      // jump
      if (this.onGround) this.coyote = CONFIG.coyoteTime; else this.coyote -= dt;
      if (this.kneeling && Input.pressed("jump") && this.onGround && this.onOneWay(level)) {
        this.dropT = 0.2; this.coyote = 0;                         // Down + Jump: drop through the platform
        this.setKneel(false, level);
      } else if (Input.pressed("jump") && this.coyote > 0 && this.hurtT <= 0 && this.setKneel(false, level)) {
        this.vy = CONFIG.jumpVel; this.jumping = true; this.coyote = 0; this.onGround = false;
        Sound.play("jump");
      }
      if (this.jumping && !Input.down("jump") && this.vy < 0) { this.vy *= CONFIG.jumpCut; this.jumping = false; }
      if (this.vy >= 0) this.jumping = false;
      this.vy = Math.min(CONFIG.maxFall, this.vy + CONFIG.gravity * dt);
      const res = moveBody(this, dt, level, { platforms: true, dropThrough: this.dropT > 0 });
      this.onGround = res.ground;
      if (res.wallTile) Game.touchTile(res.wallTile[0], res.wallTile[1]);
      if (res.ceilTile) Game.touchTile(res.ceilTile[0], res.ceilTile[1]);
      if (this.onGround) this.animT += dt * Math.abs(this.vx) / CONFIG.runSpeed;
    }

    // cigar smoke while standing around
    if (this.onGround && Math.abs(this.vx) < 10 && !this.climbing) {
      this.smokeT = (this.smokeT || 0) - dt;
      if (this.smokeT <= 0) {
        this.smokeT = 0.6;
        FX.parts.push({ x: this.face > 0 ? this.x + 9 : this.x + 1, y: this.y + 2,   // cigar ember (head 9,6) vx: rnd(-4, 4) + this.face * 3, vy: rnd(-16, -10),
          life: 1.4, max: 1.4, color: Math.random() < 0.5 ? "rgba(200,200,200,0.55)" : "rgba(160,160,160,0.45)", grav: -4, size: 2, smoke: true });
      }
    }

    // fire
    if (Input.down("fire") && this.fireCd <= 0) this.fire();     // also on ladders

    // water hazard
    const tx0 = Math.floor(this.x / TILE), tx1 = Math.floor((this.x + this.w - 1) / TILE);
    const tyw = Math.floor((this.y + this.h - 4) / TILE);
    for (let tx = tx0; tx <= tx1; tx++) {
      if (level.isWater(tx, tyw)) {
        if (this.waterCd <= 0) {
          FX.spark(this.cx(), this.y + this.h, level.waterPalette.splash, 12, 90, 0.5);
          this.waterCd = 0.4;
          this.hurt(CONFIG.waterDamage, true);
        }
        this.vy = CONFIG.jumpVel * 1.05; this.climbing = false;
        break;
      }
    }
    // fell out of the level
    if (this.y > level.pxH + 32) { this.hp = 0; this.die(); }
  },

  // A shot must not start beyond a wall: scan from Buck's centre to the far edge of the shot's
  // spawn box along its row. Returns true (and makes sparks at the wall) when one is in the way.
  muzzleBlocked(sx, w, cy) {
    const L = Game.level;
    if (!L) return false;
    const far = this.face > 0 ? sx + w : sx, ty = Math.floor(cy / TILE);
    for (let x = this.cx(); this.face > 0 ? x <= far : x >= far; x += this.face * 4) {
      const tx = Math.floor(x / TILE);
      if (L.isSolid(tx, ty)) {
        FX.spark(this.face > 0 ? tx * TILE : (tx + 1) * TILE, cy, "#ffe860", 6, 60, 0.25);
        Sound.play("deflect");
        return true;
      }
    }
    return false;
  },

  // Shot row: chest height standing (top + 14); kneeling, 6 px above the floor, low enough
  // to hit a crayfish on the ground.
  gunY() { return this.kneeling ? this.y + this.h - 6 : this.y + 14; },

  fire() {
    if (this.isCutter()) { this.fireBlade(); return; }
    const up = this.weapon === "mega";
    this.fireCd = 1 / (up ? CONFIG.fireRateUp : CONFIG.fireRate);
    this.shootT = 0.15;
    const img = up ? SPR.shotUp : SPR.shot;
    const sx = this.face > 0 ? this.x + this.w + 9 : this.x - 9 - img.width;   // muzzle of the big gun
    Game.stats.shots++;
    Sound.play(up ? "shotUp" : "shot");
    const gy = this.gunY();
    if (this.muzzleBlocked(sx, img.width, gy)) return;     // pressed against a wall
    Game.shots.push({
      x: sx, y: gy - Math.floor(img.height / 2), w: img.width, h: img.height,
      vx: this.face * CONFIG.shotSpeed * (up ? 1.2 : 1), dmg: up ? CONFIG.shotDmgUp : CONFIG.shotDmg, img: img, face: this.face,
    });
  },

  // Disc cutter (boss arena): a big spinning saw blade, slower than blaster shots. It spans
  // from gun height down to the knees, so it also cuts crayfish on the ground.
  fireBlade() {
    this.fireCd = 1 / CONFIG.cutterRate;
    this.shootT = 0.2;
    const mega = this.weapon === "megacutter";
    const sz = mega ? 16 : 14;
    const sx = this.face > 0 ? this.x + this.w + 6 : this.x - 6 - sz;
    Game.stats.shots++;
    Sound.play("grinder");
    const by = this.kneeling ? this.y + this.h - sz : this.y + 12;     // kneeling: the blade rolls along the floor
    if (this.muzzleBlocked(sx, sz, by + sz / 2)) return;
    Game.shots.push({ x: sx, y: by, w: sz, h: sz, vx: this.face * CONFIG.cutterSpeed, dmg: mega ? CONFIG.megaCutterDmg : CONFIG.cutterDmg,
      img: SPR.sawBlade[0], face: this.face, spin: true, mega: mega });
    if (mega)       // Mega Cutter: a second blade, angled slightly upward
      Game.shots.push({ x: sx, y: by - 2, w: sz, h: sz, vx: this.face * CONFIG.cutterSpeed, vy: -CONFIG.megaCutterRise, dmg: CONFIG.megaCutterDmg,
        img: SPR.sawBlade[0], face: this.face, spin: true, mega: true });
  },
  isCutter() { return this.weapon === "cutter" || this.weapon === "megacutter"; },

  // n: damage points. fromWater: no knockback (the water bounce handles movement).
  hurt(n, fromWater) {
    if (this.dead || Game.godMode || this.invuln > 0) return false;
    this.hp = Math.max(0, this.hp - n);
    this.invuln = CONFIG.invuln;
    this.hurtT = 0.3;
    this.climbing = false;
    // knockback; standing on a one-way platform (a ledge) only a small stagger, so a hit
    // doesn't throw him off it
    const ledge = this.onGround && Game.level && this.onOneWay(Game.level);
    if (!fromWater) { this.vx = -this.face * (ledge ? CONFIG.ledgeKnockback : 80); this.vy = ledge ? -60 : -150; }
    Sound.play("hurt");
    Game.hurtFlash = 0.25;            // red screen-edge flash
    FX.blood(this.cx(), this.cy(), -this.face, 5);
    FX.shake(2, 0.15);
    if (this.hp <= 0) this.die();
    return true;
  },

  heal(n) { this.hp = Math.min(CONFIG.maxHp, this.hp + n); },

  die() {
    if (this.dead) return;
    this.dead = true; this.deathT = 1.3;
    FX.explode(this.cx(), this.cy(), true);
    FX.spark(this.cx(), this.cy(), "#e8a880", 20, 120, 1.0);
    Sound.play("die");
  },

  respawn() {
    this.placeAt(this.spawnX, this.spawnY);
    this.hp = CONFIG.maxHp;
    // power-up is lost with the life; in the boss arena the disc cutter is kept
    this.weapon = Game.level && Game.level.isBoss ? "cutter" : "blaster";
    this.invuln = 1.5;
  },

  draw(camX, camY) {
    if (this.dead) return;
    if (this.invuln > 0 && Math.floor(this.invuln * 15) % 2 === 0) return;   // blink
    const cutter = this.isCutter();
    const S = cutter ? SPR.heroCutter : SPR.hero;
    let set;
    if (this.hurtT > 0) set = S.hurt;
    else if (this.climbing) set = this.shootT > 0 ? S.shoot : S.climb[Math.floor(this.climbAnim * 8) % 2];   // shooting pose on a ladder
    else if (this.kneeling) set = this.shootT > 0 ? S.kneelShoot : S.kneel;
    else if (!this.onGround) set = this.shootT > 0 ? S.shootJump : S.jump;
    else if (Math.abs(this.vx) > 10) set = (this.shootT > 0 ? S.shootRun : S.run)[Math.floor(this.animT * 10) % 4];
    else set = this.shootT > 0 ? S.shoot : S.idle;
    const climbView = this.climbing && this.shootT <= 0;   // back view while climbing
    const right = this.face > 0 || climbView;
    const img = right ? set.r : set.l;
    // torso centre is column 8 of the frame (HERO_W - 9 when mirrored)
    const ox = right ? 8 : HERO_W - 9;
    const px = Math.round(this.x + this.w / 2 - ox - camX);
    const py = Math.round(this.y + this.h - HERO_H - camY + HUD_H);
    ctx.drawImage(img, px - set.pad, py - set.pad);
    const gy = py + (this.kneeling ? KNEEL_DROP - 2 : 0);   // kneeling: the gun row is lowered (2 belly rows less)
    if (cutter && this.shootT > 0.05) {   // grinder sparks off the disc
      const dx = right ? px + 20 : px + HERO_W - 21;
      for (let i = 0; i < 4; i++) fillRect(dx + (right ? 1 : -1) * (2 + ((Game.time * 97 + i * 3) % 5 | 0)), gy + 14 + i * 2, 1, 1, i % 2 ? "#ffd040" : "#fff4a0");
    } else if (this.shootT > 0.1) {   // muzzle flash
      const mx = right ? px + HERO_W : px - 7;
      fillRect(mx, gy + 15, 7, 7, "rgba(255,150,30,0.55)");
      fillRect(mx + 1, gy + 16, 5, 5, "rgba(255,210,80,0.85)");
      fillRect(mx + (right ? 1 : 2), gy + 17, 4, 3, "#fffbe0");
      fillRect(mx + (right ? 6 : -1), gy + 18, 2, 1, "#ffffff");
    }
  },
};

// ---- enemies.js ----
// Lawyers, mutant crayfish and gardener-punks with lawn mowers, plus enemy projectiles.

function isActive(e) {
  // Enemies only think/move when within one screen of the visible area.
  return e.x + e.w > Camera.x - CONFIG.activateMarginX && e.x < Camera.x + W + CONFIG.activateMarginX &&
         e.y + e.h > Camera.y - CONFIG.activateMarginY && e.y < Camera.y + VIEW_H + CONFIG.activateMarginY;
}

// Is there floor in front of the enemy's leading foot?
function groundAhead(e, level) {
  const fx = e.vx >= 0 ? e.x + e.w + 1 : e.x - 1;
  return level.isFloor(Math.floor(fx / TILE), Math.floor((e.y + e.h + 2) / TILE));
}

function heroInFront(e, range, dyMax) {
  const dx = Player.cx() - (e.x + e.w / 2);
  const dy = Math.abs(Player.cy() - (e.y + e.h / 2));
  return !Player.dead && Math.sign(dx) === e.face && Math.abs(dx) < range && dy < dyMax;
}

function spawnEnemyShot(s) { Game.enemyShots.push(s); }

// Legal one-liners the lawyers call out when throwing (at most 20 characters, game font).
const LAWYER_LINES = ["ART. 41 OR!", "OBJECTION!", "SEE YOU IN BERN!", "YOU'RE SUED!", "TERMS APPLY!", "SIGN HERE!",
  "ZGB SAYS NO!", "SCHKG FOR YOU!", "OVERRULED!", "BILLABLE HOURS!", "ART. 8 ZGB, BUCK!", "STGB ART. 139!"];
const LawyerTalk = {
  deck: [],
  line() {
    if (!this.deck.length) {
      this.deck = LAWYER_LINES.slice();
      for (let i = this.deck.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); const t = this.deck[i]; this.deck[i] = this.deck[k]; this.deck[k] = t; }
    }
    return this.deck.pop();
  },
  // a throw may come with a line: once per lawyerTalkCd per lawyer, one lawyer bubble at a time
  maybe(e) {
    if (e.talkCd > 0 || Math.random() >= CONFIG.lawyerTalkChance) return;
    if (Game.enemies.some(function (o) { return o !== e && o.bubble && !o.dead; })) return;
    e.bubble = { text: this.line(), t: CONFIG.lawyerTalkT };
    e.talkCd = CONFIG.lawyerTalkCd;
  },
  draw(camX, camY) {
    for (const e of Game.enemies) {
      if (!e.bubble || e.dead) continue;
      const w = textWidth(e.bubble.text) + 6, h = 11;
      const cx = Math.round(e.x + e.w / 2 - camX), top = Math.round(e.y - camY + HUD_H) - h - 3;
      const x = clamp(cx - Math.floor(w / 2), 2, W - w - 2);
      drawSpeechBubble(e.bubble.text, x, Math.max(HUD_H + 2, top), w, h, cx);
    }
  },
};

const ENEMY_TYPES = {
  lawyer: {
    w: 12, h: 30, hp: CONFIG.lawyerHp, points: CONFIG.lawyerPoints, contact: 1,
    init(e) { e.vx = CONFIG.lawyerSpeed * e.face; e.cd = 0.8 + Math.random(); e.throwT = 0; },
    update(e, dt, level) {
      e.cd -= dt;
      if (e.talkCd > 0) e.talkCd -= dt;
      if (e.bubble && (e.bubble.t -= dt) <= 0) e.bubble = null;
      if (e.throwT > 0) {
        e.throwT -= dt; e.vx = 0;
        if (e.throwT <= 0.2 && !e.thrown) {
          e.thrown = true;
          spawnEnemyShot({ kind: "lawbook", code: Math.floor(Math.random() * LAWBOOK_CODES.length),   // a Swiss law book
            x: e.x + (e.face > 0 ? e.w : -10), y: e.y + 10, w: 10, h: 8, vx: 125 * e.face, vy: -70, grav: 160, dmg: 1, t: 0 });
          Sound.play("throw");
        }
        if (e.throwT <= 0) e.vx = CONFIG.lawyerSpeed * e.face;
      } else {
        e.vx = CONFIG.lawyerSpeed * e.face;
        if (e.cd <= 0 && heroInFront(e, CONFIG.lawyerRange, 20)) {
          e.throwT = 0.6; e.thrown = false; e.cd = CONFIG.lawyerCooldown;
          LawyerTalk.maybe(e);
        }
      }
      e.vy = Math.min(CONFIG.maxFall, e.vy + CONFIG.gravity * dt);
      if (e.onGround && e.vx !== 0 && !groundAhead(e, level)) { e.face = -e.face; e.vx = -e.vx; e.turned = (e.turned || 0) + 1; }
      const res = moveBody(e, dt, level, { platforms: true });
      e.onGround = res.ground;
      if (res.wallL || res.wallR) { e.face = res.wallL ? 1 : -1; }
      e.anim += dt * (e.vx ? 4 : 0);
    },
    sprite(e) { return e.throwT > 0 ? SPR.lawyerThrow : SPR.lawyer[Math.floor(e.anim) % 2]; },
  },

  cray: {
    w: 20, h: 10, hp: CONFIG.crayHp, points: CONFIG.crayPoints, contact: 1,
    init(e, level) {
      e.vx = CONFIG.craySpeed * e.face; e.cd = 0.5;
      e.submerged = level.isWater(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h - 1) / TILE));
      e.subT = 0;
    },
    update(e, dt, level) {
      const dx = Player.cx() - (e.x + e.w / 2), dy = Player.cy() - (e.y + e.h / 2);
      if (e.submerged) {
        e.vx = 0; e.vy = 0; e.subT -= dt;
        if (e.subT <= 0 && !Player.dead && Math.abs(dx) < 110 && Math.abs(dy) < 90) {
          // emerge: leap out of the water toward the hero
          e.submerged = false; e.leaping = true; e.face = Math.sign(dx) || 1;
          e.vy = -340; e.vx = clamp(dx / 0.7, -130, 130);
          FX.spark(e.x + e.w / 2, e.y, level.waterPalette.splash, 14, 100, 0.5);
          Sound.play("leap");
        }
        return;
      }
      e.cd -= dt;
      if (e.onGround && !e.leaping) {
        e.vx = CONFIG.craySpeed * e.face;
        if (e.cd <= 0 && !Player.dead && Math.abs(dx) < CONFIG.crayLeapRange && Math.abs(dy) < 60) {
          // leap in an arc toward the hero's position
          e.face = Math.sign(dx) || e.face;
          e.vy = -260; e.vx = clamp(dx / 0.52, -120, 120);
          e.leaping = true; e.cd = CONFIG.crayCooldown; e.leaps = (e.leaps || 0) + 1;
          Sound.play("leap");
        } else if (!groundAhead(e, level)) { e.face = -e.face; e.vx = -e.vx; }
      }
      e.vy = Math.min(CONFIG.maxFall, e.vy + CONFIG.gravity * dt);
      const res = moveBody(e, dt, level, { platforms: true });
      if (res.ground && e.leaping) e.leaping = false;
      e.onGround = res.ground;
      if ((res.wallL || res.wallR) && !e.leaping) e.face = res.wallL ? 1 : -1;
      // falling back into the water: dive and re-emerge later
      if (e.vy > 0 && level.isWater(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h - 2) / TILE))) {
        e.submerged = true; e.subT = 1.5; e.leaping = false;
        e.y = Math.floor((e.y + e.h - 2) / TILE) * TILE + TILE - e.h;
      }
      e.anim += dt * 8;
    },
    sprite(e) { return SPR.cray[Math.floor(e.anim) % 2]; },
    hidden(e) { return e.submerged; },
  },

  // Gardener-punk pushing a lawn mower: patrol -> rev (wind-up) -> charge -> cooldown.
  punk: {
    w: 24, h: 28, hp: CONFIG.punkHp, points: CONFIG.punkPoints, contact: 2,
    init(e) { e.state = "patrol"; e.vx = CONFIG.punkSpeed * e.face; e.cd = 0.8; e.smokeT = Math.random(); e.puffs = 0; e.turned = 0; },
    update(e, dt, level) {
      e.cd -= dt;
      // the blunt: a smoke puff about once per second (cosmetic)
      e.smokeT -= dt;
      if (e.smokeT <= 0) {
        e.smokeT = rnd(0.85, 1.15); e.puffs++;
        const bx = e.face > 0 ? e.x + e.w / 2 - 5 : e.x + e.w / 2 + 4;
        FX.parts.push({ x: bx, y: e.y + e.h - 23, vx: rnd(-4, 4), vy: rnd(-16, -10), life: 1.3, max: 1.3,
          color: Math.random() < 0.5 ? "rgba(200,200,190,0.55)" : "rgba(150,160,140,0.5)", grav: -4, size: 2, smoke: true });
      }
      punkExhaust(e, dt);
      const front = e.face > 0 ? e.x + e.w : e.x;
      switch (e.state) {
        case "patrol":
          e.vx = CONFIG.punkSpeed * e.face;
          if (e.cd <= 0 && heroInFront(e, CONFIG.punkRange, 24)) {
            e.state = "rev"; e.t = CONFIG.punkRev; e.vx = 0; Sound.play("rev");
          }
          break;
        case "rev":
          e.vx = 0; e.t -= dt;
          if (e.t <= 0) { e.state = "charge"; e.dist = 0; e.clipT = 0; e.charges = (e.charges || 0) + 1; Sound.play("mower"); }
          break;
        case "charge":
          e.vx = CONFIG.punkChargeSpeed * e.face;
          e.clipT -= dt;
          if (e.clipT <= 0) {
            e.clipT = 0.08;
            const stone = Math.random() < 0.3;
            spawnEnemyShot({ kind: "clipping", stone: stone, x: front - (e.face > 0 ? 0 : 3), y: e.y + e.h - 8 + rnd(-2, 2),
              w: stone ? 3 : 2, h: stone ? 3 : 2, vx: e.face * rnd(140, 200) + e.vx * 0.3, vy: rnd(-80, -20), grav: 300, dmg: 1, life: 0.35 });
          }
          break;
      }
      e.vy = Math.min(CONFIG.maxFall, e.vy + CONFIG.gravity * dt);
      if (e.onGround && e.vx !== 0 && !groundAhead(e, level)) {
        if (e.state === "charge") { e.state = "patrol"; e.cd = CONFIG.punkCooldown; }
        e.face = -e.face; e.vx = CONFIG.punkSpeed * e.face; e.turned++;
      }
      const res = moveBody(e, dt, level, { platforms: true });
      e.onGround = res.ground;
      if (e.state === "charge") e.dist += Math.abs(e.vx) * dt;
      if (res.wallL || res.wallR) {
        e.face = res.wallL ? 1 : -1;
        if (e.state === "charge") { e.state = "patrol"; e.cd = CONFIG.punkCooldown; }
      }
      if (e.state === "charge" && e.dist >= CONFIG.punkChargeMax) { e.state = "patrol"; e.cd = CONFIG.punkCooldown; }
      e.anim += dt * (e.state === "charge" ? 14 : 6);
    },
    sprite(e) {
      if (e.state === "rev") return Math.floor(e.anim * 2 + e.t * 30) % 2 ? SPR.punk.rev : SPR.punk.walk[0];
      return SPR.punk.walk[Math.floor(e.anim) % 2];
    },
  },
};

// Petrol-mower exhaust from the muffler, following the engine: light blue-grey puffs while
// patrolling, thick black clouds while revving, a dark trail while charging. Cosmetic.
const EXHAUST = {
  patrol: { every: [0.2, 0.28], color: "rgba(215,220,228,0.8)", size: [2, 3], vy: [-24, -16], back: [1, 5], life: 1.1 },
  rev:    { every: [0.035, 0.05], color: "rgba(36,36,36,0.85)", size: [3, 4], vy: [-34, -20], back: [2, 8], life: 0.9 },
  charge: { every: [0.05, 0.05], color: "rgba(28,28,28,0.8)", size: [3, 4], vy: [-16, -8], back: [30, 50], life: 0.7 },
};
function punkExhaust(e, dt) {
  const X = EXHAUST[e.state] || EXHAUST.patrol;
  e.exhaustT = (e.exhaustT === undefined ? Math.random() * 0.2 : e.exhaustT) - dt;
  if (e.exhaustT > 0) return;
  e.exhaustT = rnd(X.every[0], X.every[1]);
  const fx = e.x + e.w / 2 - 15 + (e.face > 0 ? MOWER_EXHAUST.x : 29 - MOWER_EXHAUST.x);
  const fy = e.y + e.h - 30 + MOWER_EXHAUST.y - 2;
  FX.parts.push({ x: fx, y: fy, vx: -e.face * rnd(X.back[0], X.back[1]), vy: rnd(X.vy[0], X.vy[1]), life: X.life, max: X.life,
    color: X.color, grav: -6, size: Math.round(rnd(X.size[0], X.size[1])), smoke: true, exhaust: e.state });
  e.exhaust = e.exhaust || { patrol: 0, rev: 0, charge: 0 };
  e.exhaust[e.state] = (e.exhaust[e.state] || 0) + 1;
}

function makeEnemy(type, px, py, level, face) {
  const T = ENEMY_TYPES[type];
  const e = { type: type, T: T, x: px, y: py, w: T.w, h: T.h, vx: 0, vy: 0, hp: T.hp, face: face || -1,
              flash: 0, anim: 0, onGround: false, dead: false };
  e.x -= e.w / 2; e.y -= e.h;           // px,py = bottom centre
  T.init(e, level);
  return e;
}

// Per-type gore. dir: direction of the killing/hitting shot (-1, 0, 1).
const GORE_BY_TYPE = {
  lawyer: {
    hit(e, x, y, dir) { FX.blood(x, y, dir, 4); },
    die(e, x, y, dir) {
      FX.blood(x, y, dir, 40); FX.gibs(x, y, GORE.blood.concat(GORE.suit), 6);
      // the subpoenas go flying
      for (let i = 0; i < 6; i++) FX.parts.push({ x: x, y: y - 6, vx: rnd(-60, 60), vy: rnd(-120, -40), life: 1.6, max: 1.6, color: "#f0ecd8", grav: 60, size: 2 });
    },
  },
  cray: {
    hit(e, x, y, dir) { FX.blood(x, y, dir, 3); },
    die(e, x, y, dir) { FX.blood(x, y, dir, 30); FX.gibs(x, y, GORE.shell, 5); },
  },
  // punk: a shot against his facing hits the mower (oil, sparks); otherwise it hits him (blood)
  punk: {
    hit(e, x, y, dir) {
      if (dir === -e.face) { FX.blood(x, y + 6, dir, 3, GORE.oil); FX.spark(x, y + 6, pick(GORE.spark), 4, 90, 0.3, 200); }
      else FX.blood(x, y, dir, 4);
    },
    die(e, x, y, dir) {
      Sound.play("choke");                             // the engine sputters and dies with him
      FX.blood(x, y - 4, dir, 35); FX.gibs(x, y - 4, GORE.blood.concat(GORE.punk), 6);
      const mx = x + e.face * 8, my = y + 8;
      FX.blood(mx, my, dir, 20, GORE.oil);
      for (let i = 0; i < 3; i++) FX.spark(mx, my, GORE.spark[i], 7, 140, 0.5, 250);
      FX.gibs(mx, my, GORE.metal.concat(["#c82020"]), 5, false);
      FX.parts.push({ x: mx, y: my, vx: 0, vy: 0, life: 0.15, max: 0.15, ring: 10, color: "#fff4a0", grav: 0 });
    },
  },
};

function damageEnemy(e, dmg, dir) {
  e.hp -= dmg; e.flash = 0.08;
  dir = dir || 0;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const gore = GORE_BY_TYPE[e.type];
  if (e.hp <= 0) {
    e.dead = true;
    gore.die(e, cx, cy, dir);
    FX.text(e.x + e.w / 2, e.y - 4, e.T.points, "#ffe860");
    Game.addScore(e.T.points);
    Game.stats.kills++;
    Fans.react(e.x + e.w / 2, e.y + e.h / 2, "kill");
    Sound.play("explode");
  } else { gore.hit(e, cx - dir * e.w / 2, cy, dir); Sound.play("hit"); }
}

function updateEnemies(dt, level) {
  const list = Game.enemies;
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    if (e.dead) { list.splice(i, 1); continue; }
    if (!isActive(e)) { e.active = false; continue; }
    e.active = true;
    if (e.flash > 0) e.flash -= dt;
    e.T.update(e, dt, level);
    if (e.y > level.pxH + 32) { e.dead = true; continue; }
    const hidden = e.T.hidden && e.T.hidden(e);
    if (!hidden && overlap(e, Player)) Player.hurt(e.T.contact);
  }
}

// A law book bursts into fluttering pages and the floating label names one of its articles.
function burstBook(s) {
  const b = LAWBOOK_CODES[s.code || 0], cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  FX.spark(cx, cy, "#f4ecd0", 5, 70, 0.9, 90);
  FX.spark(cx, cy, "#ffffff", 3, 60, 0.9, 90);
  FX.text(cx, cy - 8, b.arts[Math.floor(Math.random() * b.arts.length)], b.cover === "#2a4ca0" ? "#7fa0ff" : b.cover);
}

function updateEnemyShots(dt, level) {
  const list = Game.enemyShots;
  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i];
    let remove = false;
    if (s.kind === "shockwave") {
      s.x += s.vx * dt; s.life -= dt;
      if (Math.random() < 0.6) FX.parts.push({ x: s.x + s.w / 2, y: s.y + s.h, vx: rnd(-20, 20), vy: rnd(-80, -30), life: 0.3, max: 0.3, color: "#c8a070", grav: 300 });
      if (s.life <= 0 || s.x < -20 || s.x > level.pxW + 20) remove = true;
      // stopped by the first solid tile or crate at floor height; wears down breakable crates
      const lx = s.vx < 0 ? s.x : s.x + s.w, ltx = Math.floor(lx / TILE), lty = Math.floor((s.y + s.h - 1) / TILE);
      if (!remove && level.isSolid(ltx, lty)) {
        remove = true;
        FX.spark(lx, s.y + s.h - 2, "#c8a070", 14, 90, 0.5, 300);
        if (level.at(ltx, lty) === "d") level.hitCrate(ltx, lty, CONFIG.shockwaveCrateDmg);
      }
    } else {
      s.vy += (s.grav || 0) * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.t = (s.t || 0) + dt;
      if (s.life !== undefined) { s.life -= dt; if (s.life <= 0) remove = true; }
      if (level.isSolid(Math.floor((s.x + s.w / 2) / TILE), Math.floor((s.y + s.h / 2) / TILE))) {
        remove = true; FX.spark(s.x + s.w / 2, s.y + s.h / 2, s.kind === "bubble" ? "#bfe6ff" : "#a07040", 6, 60, 0.3);
        if (s.kind === "lawbook") burstBook(s);
      }
      if (s.y > level.pxH + 20 || s.x < Camera.x - 40 || s.x > Camera.x + W + 40) remove = true;
    }
    if (!remove && overlap(s, Player)) {
      // projectiles vanish on a successful hit; spray clouds and shockwaves persist
      if (Player.hurt(s.dmg) && s.kind !== "shockwave") { remove = true; if (s.kind === "lawbook") burstBook(s); }
    }
    if (remove) list.splice(i, 1);
  }
}

// Hero projectiles vs walls, enemies and the boss.
function updateHeroShots(dt, level) {
  const list = Game.shots;
  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i];
    s.x += s.vx * dt;
    if (s.vy) s.y += s.vy * dt;
    let remove = false;
    if (s.deflected) {
      s.life -= dt; if (s.life <= 0) remove = true;
    } else {
      const fx = s.vx > 0 ? s.x + s.w : s.x;
      const ttx = Math.floor(fx / TILE), tty = Math.floor((s.y + s.h / 2) / TILE), t = level.at(ttx, tty);
      if (SOLID_CH.indexOf(t) >= 0) {
        remove = true; FX.spark(fx, s.y + s.h / 2, "#ffe860", 5, 50, 0.25);
        if (t === "d") level.hitCrate(ttx, tty, s.dmg || 1);
      }
      if (!remove) {
        for (const e of Game.enemies) {
          if (e.dead || !e.active || (e.T.hidden && e.T.hidden(e))) continue;
          if (overlap(s, e)) { damageEnemy(e, s.dmg, Math.sign(s.vx)); remove = true; break; }
        }
      }
      if (!remove && Game.boss && Boss.hitByShot(s)) remove = !s.deflected;
    }
    // leaves the screen
    if (s.x + s.w < Camera.x || s.x > Camera.x + W) remove = true;
    if (remove) list.splice(i, 1);
  }
}

function drawEnemies(camX, camY) {
  for (const e of Game.enemies) {
    if (e.T.hidden && e.T.hidden(e)) {
      // bubbles where a crayfish lurks
      if (Math.floor(Game.time * 3 + e.x) % 3 === 0)
        fillRect(e.x + e.w / 2 - camX + Math.sin(Game.time * 5 + e.x) * 3, e.y - 2 - camY + HUD_H, 2, 2, Game.level.waterPalette.bubble);
      continue;
    }
    const set = e.T.sprite(e);
    const right = e.face > 0;
    const img = e.flash > 0 ? (right ? set.fr : set.fl) : (right ? set.r : set.l);
    const px = Math.round(e.x + e.w / 2 - set.w / 2 - camX);
    const py = Math.round(e.y + e.h - set.h - camY + HUD_H);
    ctx.drawImage(img, px - set.pad, py - set.pad);
  }
}

function drawEnemyShots(camX, camY) {
  for (const s of Game.enemyShots) {
    const sx = Math.round(s.x - camX), sy = Math.round(s.y - camY + HUD_H);
    if (s.kind === "lawbook") {
      const set = SPR.lawbook[s.code || 0][Math.floor(s.t * 10) % 2];       // tumbling
      ctx.drawImage(s.vx < 0 ? set.l : set.r, sx - set.pad, sy - set.pad);
    } else if (s.kind === "bubble") {
      ctx.drawImage(SPR.bubble, sx, sy);
    } else if (s.kind === "shockwave") {
      fillRect(sx, sy + 4, s.w, s.h - 4, "rgba(200,160,112,0.8)");
      fillRect(sx + 2, sy, s.w - 4, 4, "rgba(240,220,180,0.8)");
    } else if (s.kind === "clipping") {
      fillRect(sx, sy, s.w, s.h, s.stone ? "#8a8680" : (Math.floor(s.x) % 2 ? "#5ab040" : "#3e8a2c"));
    }
  }
}

// ---- boss.js ----
// The giant mutant crayfish. Faces left. Only its face/eye stalks take damage, and
// only while the claws are raised; shell and closed claws deflect shots.
// Attack cycle: claw slam (screen shake + shockwave), bubble arc, summon minions.
const BOSS_ATTACKS = ["slam", "bubbles", "summon"];

function rect(g, x, y, w, h, color) { g.fillStyle = color; g.fillRect(Math.round(x), Math.round(y), w, h); }
const bossLayers = (function () {
  let L = null;
  return function () {
    if (!L) { const c = makeCanvas(W, H), s = makeCanvas(W, H); L = { c: c, g: c.getContext("2d"), s: s, sg: s.getContext("2d") }; }
    return L;
  };
})();

const Boss = {
  active: false,
  init(px, floorY) {
    this.active = true;
    this.ox = px; this.homeX = px; this.floor = floorY;
    this.hp = CONFIG.bossHp; this.maxHp = CONFIG.bossHp;
    this.summons = 0;              // summon attacks so far (limited per fight, not reset on respawn)
    this.state = "intro"; this.t = 1.5; this.attackIdx = 0; this.raised = false; this.claw = 0; // 0 down .. 1 up
    this.flash = 0; this.anim = 0; this.dir = -1; this.dying = 0; this.fired = 0;
    this.healthTimer = 12;
    this.log = [];                 // attack history (used by the automated tests)
    Game.boss = this;
  },
  enraged() { return this.hp < this.maxHp * 0.5; },
  idleTime() { return this.enraged() ? 0.8 : 1.7; },

  // hitboxes in world coordinates
  face() { return { x: this.ox, y: this.floor - 66, w: 26, h: 62 }; },
  shell() { return { x: this.ox + 20, y: this.floor - 52, w: 110, h: 48 }; },
  claws() {
    return this.claw > 0.5
      ? { x: this.ox - 30, y: this.floor - 120, w: 36, h: 46 }
      : { x: this.ox - 36, y: this.floor - 56, w: 36, h: 54 };
  },
  boxes() { return [this.face(), this.shell(), this.claws()]; },

  update(dt, level) {
    if (!this.active) return;
    this.anim += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.state === "dying") {
      this.dying -= dt;
      if (Math.random() < 0.35) {
        const gx = this.ox + rnd(-30, 120), gy = this.floor - rnd(0, 80);
        FX.explode(gx, gy, Math.random() < 0.3);
        FX.blood(gx, gy, 0, 12); if (Math.random() < 0.4) FX.gibs(gx, gy, GORE.shell, 3);
        if (Math.random() < 0.3) Sound.play("explode");
      }
      FX.shake(3, 0.1);
      if (this.dying <= 0) { this.active = false; Game.boss = null; Game.onBossDefeated(); }
      return;
    }
    this.t -= dt;
    const targetClaw = this.raised ? 1 : 0;
    this.claw += clamp(targetClaw - this.claw, -dt * 6, dt * 6);

    switch (this.state) {
      case "intro":
        if (this.t <= 0) this.toIdle();
        break;
      case "idle": {
        // creep toward / away from the hero within its home range
        const want = clamp(Player.cx() + 90, this.homeX - 50, this.homeX + 10);
        const sp = this.enraged() ? 30 : 18;
        if (Math.abs(want - this.ox) > 2) this.ox += Math.sign(want - this.ox) * sp * dt;
        if (this.t <= 0) this.startAttack(this.nextAttack());
        break;
      }
      case "slam":
        if (this.phase === "raise" && this.t <= 0) {
          this.phase = "down"; this.raised = false; this.claw = 0; this.t = 0.6;
          FX.shake(5, 0.45); Sound.play("slam");
          const cl = this.claws();
          FX.spark(cl.x + 10, this.floor, "#c8a070", 20, 100, 0.6);
          Game.enemyShots.push({ kind: "shockwave", x: cl.x - 10, y: this.floor - 12, w: 12, h: 12,
            vx: this.enraged() ? -190 : -150, life: 3, dmg: 2 });
          this.log.push("slam");
        } else if (this.phase === "down" && this.t <= 0) this.toIdle();
        break;
      case "bubbles": {
        const total = this.enraged() ? 9 : 6;
        if (this.phase === "raise" && this.t <= 0) { this.phase = "spit"; this.t = 1.2; this.fired = 0; }
        if (this.phase === "spit") {
          const due = Math.floor((1 - this.t / 1.2) * total);
          while (this.fired < Math.min(due, total)) {
            const k = this.fired / (total - 1);
            Game.enemyShots.push({ kind: "bubble", x: this.ox - 4, y: this.floor - 34, w: 8, h: 8,
              vx: -(60 + k * 130), vy: -(150 + (1 - k) * 120), grav: 260, dmg: 1 });
            this.fired++; Sound.play("bubble");
          }
          if (this.t <= 0) { this.log.push("bubbles"); this.toIdle(); }
        }
        break;
      }
      case "summon":
        if (this.t <= 0) {
          const minions = Game.enemies.filter(function (e) { return e.type === "cray" && !e.dead; }).length;
          const n = this.summons < CONFIG.bossSummons ? Math.min(2, 4 - minions) : 0;
          this.summons++;
          // inside the camera view, left of the boss (clamped when the view is tight)
          const lo = Math.max(Camera.x + 24, 40), hi = Math.max(lo, Math.min(this.ox - 60, Camera.x + W - 24));
          for (let i = 0; i < n; i++) {
            const x = rnd(lo, hi);
            Game.enemies.push(makeEnemy("cray", x, 40, level, 1));
            FX.spark(x, 32, "#ff8060", 10, 60, 0.4);
          }
          Sound.play("leap");
          this.log.push("summon");
          this.toIdle();
        }
        break;
    }
    // contact damage
    for (const b of this.boxes()) if (overlap(b, Player)) { Player.hurt(2); break; }

    // periodic health pickups in the arena
    this.healthTimer -= dt;
    if (this.healthTimer <= 0) {
      this.healthTimer = 15;
      const has = Game.pickups.some(function (p) { return p.type === "h" || p.type === "s"; });
      if (!has && Game.arenaHealthSpots && Game.arenaHealthSpots.length) {
        const spot = Game.arenaHealthSpots[Math.floor(Math.random() * Game.arenaHealthSpots.length)];
        Game.addPickup("h", spot.x, spot.y);
        FX.spark(spot.x, spot.y - 8, "#ffffff", 10, 60, 0.4);
      }
    }
  },

  // Next attack of the slam -> bubbles -> summon cycle; once the summons are used up the
  // summon slot is skipped (slam -> bubbles -> slam ...).
  nextAttack() {
    let a = BOSS_ATTACKS[this.attackIdx++ % BOSS_ATTACKS.length];
    if (a === "summon" && this.summons >= CONFIG.bossSummons) a = BOSS_ATTACKS[this.attackIdx++ % BOSS_ATTACKS.length];
    return a;
  },
  toIdle() { this.state = "idle"; this.raised = false; this.t = this.idleTime(); this.phase = null; },
  startAttack(name) {
    this.state = name; this.phase = "raise"; this.raised = true;

  },

  // Called for every hero shot. Returns true when the shot hit any part of the boss.
  hitByShot(s) {
    if (!this.active || this.state === "dying" || this.state === "intro") return false;

      this.hp -= s.dmg; this.flash = 0.08;
      FX.blood(s.x + s.w / 2, s.y, -Math.sign(s.vx), 5);
      Game.addScore(10);
      Sound.play("bosshurt");
      FX.spark(s.x + s.w / 2, s.y, "#ffffff", 4, 60, 0.2);
      if (this.hp <= 0) this.die();
      return true;
    }
    for (const b of this.boxes()) {
      if (overlap(s, b)) {
        s.deflected = true; s.vx = -s.vx * 0.6; s.vy = -90; s.life = 0.35;
        FX.spark(s.x + s.w / 2, s.y + s.h / 2, "#ffffff", 5, 70, 0.2);
        if (s.spin) { FX.spark(s.x + s.w / 2, s.y + s.h / 2, "#ffd040", 14, 140, 0.4); FX.spark(s.x + s.w / 2, s.y + s.h / 2, "#ff9a20", 8, 100, 0.3); }
        Sound.play("deflect");
        this.deflects = (this.deflects || 0) + 1;
        return true;
      }
    }
    return false;
  },

  die() {
    this.hp = 0; this.state = "dying"; this.dying = 2.6; this.raised = false;
    Game.addScore(CONFIG.bossPoints);
    FX.text(this.ox + 40, this.floor - 90, CONFIG.bossPoints, "#ffe860");
    Sound.play("bigexplode");
    Game.enemyShots.length = 0;
    // the big shower
    const cx = this.ox + 40, cy = this.floor - 40;
    FX.blood(cx, cy, -1, 80); FX.blood(cx, cy, 1, 40); FX.gibs(cx, cy, GORE.shell.concat(GORE.blood), 14);
  },

  // Rendered offscreen, then outlined with the same dark outline as the sprites.
  draw(camX, camY) {
    if (!this.active) return;
    const L = bossLayers();
    L.g.clearRect(0, 0, W, H);
    this.drawBody(L.g, camX, camY);
    L.sg.globalCompositeOperation = "source-over"; L.sg.clearRect(0, 0, W, H); L.sg.drawImage(L.c, 0, 0);
    L.sg.globalCompositeOperation = "source-in"; L.sg.fillStyle = "rgb(" + OUTLINE_COLOR.join(",") + ")"; L.sg.fillRect(0, 0, W, H);
    ctx.drawImage(L.s, -1, 0); ctx.drawImage(L.s, 1, 0); ctx.drawImage(L.s, 0, -1); ctx.drawImage(L.s, 0, 1);
    ctx.drawImage(L.c, 0, 0);
  },

  // Draws the boss parts into context g (screen coordinates).
  drawBody(g, camX, camY) {
    const fl = this.flash > 0;
    // Realistic red crayfish (see the change's reference photo): glossy red-brown armour,
    // darker shading below, sheen highlights, overlapping tail plates, heavy pale-tipped claws.
    const C = {
      shell: fl ? "#fff" : "#8c2c1c", shell2: fl ? "#fff" : "#561810", hi: fl ? "#fff" : "#b84a32",
      sheen: fl ? "#fff" : "#e0806a", tip: fl ? "#fff" : "#e8c8b0", dark: fl ? "#fff" : "#3e100a",
      head: fl ? "#fff" : "#8c2c1c", leg: fl ? "#fff" : "#561810", eye: this.enraged() ? "#ff3020" : "#101018",
    };
    const sx = Math.round(this.ox - camX), sy = Math.round(this.floor - camY + HUD_H);
    const bob = Math.round(Math.sin(this.anim * 3) * 1);
    // legs
    for (let i = 0; i < 4; i++) {
      const lx = sx + 34 + i * 18, k = Math.round(Math.sin(this.anim * 6 + i) * 2);
      rect(g, lx, sy - 12, 3, 12, C.leg); rect(g, lx - 4 + k, sy - 3, 8, 3, C.leg);
    }
    // tail: overlapping plates (each lit on top, shaded below) and a two-shade tail fan
    pxEllipse(g, sx + 118, sy - 26 + bob, 16, 12, C.shell2);
    pxEllipse(g, sx + 117, sy - 29 + bob, 14, 8, C.shell);
    pxEllipse(g, sx + 136, sy - 22 + bob, 11, 9, C.shell2);
    pxEllipse(g, sx + 135, sy - 25 + bob, 9, 6, C.shell);
    rect(g, sx + 108, sy - 37 + bob, 14, 2, C.sheen); rect(g, sx + 130, sy - 30 + bob, 9, 1, C.sheen);
    pxEllipse(g, sx + 150, sy - 20 + bob, 6, 14, C.shell2);
    pxEllipse(g, sx + 149, sy - 22 + bob, 4, 10, C.hi);
    rect(g, sx + 150, sy - 32 + bob, 1, 24, C.shell2);                   // fan rib
    // carapace: glossy dome, darker lower half, plate seams, cervical groove, sheen band
    const scx = sx + 70, scy = sy - 30 + bob;
    pxEllipse(g, scx, scy, 48, 25, C.shell2);
    pxEllipse(g, scx - 2, scy - 4, 45, 20, C.shell);
    pxEllipse(g, scx - 6, scy - 12, 34, 9, C.hi);
    for (let i = 0; i < 4; i++) {                                        // overlapping plate seams
      const gx = sx + 44 + i * 16;
      rect(g, gx, scy - 20, 2, 38, C.shell2); rect(g, gx + 2, scy - 20, 1, 30, C.hi);
    }
    rect(g, sx + 36, scy - 18, 2, 30, C.dark);                           // cervical groove
    rect(g, scx - 30, scy - 19, 44, 2, C.sheen); rect(g, scx - 24, scy - 21, 26, 1, C.sheen);   // wet sheen
    for (let x = scx - 36; x <= scx + 36; x += 9) rect(g, x, scy + 6 + ((x / 9) % 2 ? 2 : 0), 2, 1, C.shell2);   // pitted texture
    // head with a pointed rostrum between the eye stalks
    pxEllipse(g, sx + 16, sy - 30 + bob, 18, 22, C.shell2);
    pxEllipse(g, sx + 17, sy - 33 + bob, 15, 17, C.head);
    rect(g, sx + 8, sy - 46 + bob, 12, 2, C.sheen);
    rect(g, sx + 2, sy - 50 + bob, 12, 3, C.hi); rect(g, sx - 4, sy - 49 + bob, 6, 2, C.hi); rect(g, sx - 7, sy - 48 + bob, 3, 1, C.shell2);   // rostrum
    rect(g, sx + 2, sy - 22 + bob, 10, 4, "#300a06");                    // mouth
    rect(g, sx + 1, sy - 18 + bob, 3, 6, C.leg); rect(g, sx + 9, sy - 18 + bob, 3, 6, C.leg); // mandibles
    // eye stalks
    rect(g, sx + 8, sy - 64 + bob, 3, 16, C.head); rect(g, sx + 20, sy - 66 + bob, 3, 18, C.head);
    pxEllipse(g, sx + 9, sy - 66 + bob, 4, 4, C.eye); pxEllipse(g, sx + 21, sy - 68 + bob, 4, 4, C.eye);
    rect(g, sx + 8, sy - 68 + bob, 1, 1, "#fff"); rect(g, sx + 20, sy - 70 + bob, 1, 1, "#fff");
    // long antennae: two whip-like arcs, about 60 px each, swaying out of phase
    g.fillStyle = C.shell2;
    for (let a = 0; a < 2; a++) {
      for (let i = 0; i < 60; i++) {
        g.fillRect(Math.round(sx + 6 + a * 8 - i * 1.5), Math.round(sy - 58 + bob - a * 4 - Math.sin(i / 12 + this.anim * 2 + a * 1.3) * (6 + i * 0.15) - i * 0.9), 1, 1);
      }
    }
    // claws (far one darker, then near one), each on a jointed arm from the body
    const cl = this.claws();
    const open = this.raised ? Math.round(4 + Math.sin(this.anim * 10) * 3) : 0;
    const shoulderX = sx + 22, shoulderY = sy - 26 + bob;
    const far = { x: cl.x - camX + 6, y: cl.y - camY + HUD_H - 6 }, near = { x: cl.x - camX, y: cl.y - camY + HUD_H };
    this.drawArm(g, shoulderX + 4, shoulderY - 4, far.x + 22, far.y + 26, C.leg);
    this.drawClaw(g, far.x, far.y, open, C.shell2, C, C.dark);
    this.drawArm(g, shoulderX, shoulderY, near.x + 22, near.y + 26, C.shell2);
    this.drawClaw(g, near.x, near.y, open, C.shell, C, C.hi);
  },

  drawArm(g, x0, y0, x1, y1, col) {
    for (let i = 0; i <= 4; i++) {
      const t = i / 4;
      pxEllipse(g, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, 6, 5, col);
    }
  },

  drawClaw(g, x, y, open, col, C, lit) {
    x = Math.round(x); y = Math.round(y);
    pxEllipse(g, x + 22, y + 26, 14, 16, col);                          // heavy palm
    pxEllipse(g, x + 24, y + 20, 9, 7, lit);                            // its lit upper face
    pxEllipse(g, x + 12, y + 14 - open, 13, 7, col);                    // upper finger
    pxEllipse(g, x + 12, y + 36 + open, 12, 6, col);                    // lower finger
    rect(g, x + 8, y + 9 - open, 12, 1, C.sheen);                       // wet sheen on the finger
    rect(g, x - 1, y + 12 - open, 5, 4, C.tip); rect(g, x, y + 34 + open, 5, 4, C.tip);   // pale tips
    for (let k = 0; k < 5; k++) {                                       // knobbly inner edges
      rect(g, x + 4 + k * 3, y + 19 - open, 2, 1, C.dark);
      rect(g, x + 4 + k * 3, y + 32 + open, 2, 1, C.dark);
    }
    rect(g, x + 30, y + 22, 2, 8, C.dark);                              // wrist joint
  },
};

// ---- fans.js ----
// Cheering tennis fans: TC Wollerau players in 1970s tennis whites cheering Buck from the
// background. Purely decorative: no collisions, no effect on gameplay. Placed with the map
// character F; each fan in a level gets a different look (hair, skin, accent, accessory).

  { hair: "bun", hairCol: "brown", skin: "tan", accent: "blue", item: "visor" },

  { hair: "bun", hairCol: "ash", skin: "brown", accent: "teal", item: "cap" },

const FAN_FRAMES = ["idle", "wave", "jump", "kiss"];
const FAN_W = 20, FAN_H = 32;
// What the fans call out, by occasion: cheeky 70s-grindhouse flirting, never explicit.
