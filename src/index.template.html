    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;

  }
  /* touch mode (src/touch.js): no scrolling, zooming, selection or long-press menus */
  html.touch, html.touch body {
    height: 100dvh;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pad { display: none; position: fixed; left: 0; top: 0; z-index: 2; touch-action: none; image-rendering: pixelated; }
  #test-out { position: absolute; left: 0; top: 0; z-index: 3; color: #0f0; font: 12px monospace; white-space: pre; display: none; }
